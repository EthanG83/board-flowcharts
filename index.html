/* Progressive disclosure is added when the chart controls are ready. */
.study .chart[hidden] { display: none; }
.study .index a[aria-current="true"] {
  color: var(--accent-dark);
  border-color: var(--accent);
  background: var(--tint);
}
.starting-label { margin-top: 18px; font-size: .87rem; font-weight: 750; color: var(--muted); }
.starting-label + .index { padding-top: 7px; }
.study .chart-heading h2 { flex: 1; }
.starting-link { font-size: .79rem; white-space: nowrap; }
.study .start { padding: 15px 17px; }
.study .start p { max-width: 510px; margin-inline: auto; }
.disclosure-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  max-width: 100%;
  margin-top: 8px;
  padding: 4px 8px;
  border: 1px solid #a8cbc2;
  border-radius: 6px;
  background: #fff;
  color: var(--accent-dark);
  font: inherit;
  font-size: .78rem;
  font-weight: 720;
  line-height: 1.22;
  text-align: left;
  cursor: pointer;
}
.disclosure-toggle:hover { background: #d8eee7; border-color: var(--accent); }
.start .disclosure-toggle { margin-top: 10px; padding-inline: 10px; }
.disclosure-toggle svg { width: 15px; height: 15px; flex: none; transition: transform .28s ease; }
.disclosure-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.disclosure-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  visibility: hidden;
  transition: grid-template-rows .3s ease, opacity .22s ease, visibility 0s linear .3s;
}
.disclosure-panel[data-open] {
  grid-template-rows: 1fr;
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
.disclosure-inner { min-height: 0; overflow: hidden; }
.study .result {
  display: block;
  position: relative;
  margin: 11px 0 1px;
  padding: 7px 9px;
  border: 1px solid #c9e4da;
  border-radius: 5px;
  background: var(--tint);
}
.study .result::before {
  content: "";
  position: absolute;
  height: 11px;
  left: 12px;
  bottom: 100%;
  border-left: 1px solid var(--line);
}
.study .result .arrow { display: none; }
.study .supplement { padding-top: 2px; }
.sources summary { cursor: pointer; color: var(--accent-dark); font-weight: 700; }
.sources summary:hover { text-decoration: underline; }
@media screen and (max-width: 650px) {
  .study .chart-heading { flex-wrap: wrap; column-gap: 8px; row-gap: 4px; }
  .starting-link { margin-left: auto; }
  .disclosure-toggle { min-height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  .disclosure-panel, .disclosure-toggle svg { transition: none; }
}
@media print {
  .study .chart[hidden] { display: block !important; }
  .disclosure-panel { display: block; visibility: visible; opacity: 1; }
  .disclosure-inner { overflow: visible; }
  .starting-label, .starting-link, .disclosure-toggle, .sources summary { display: none !important; }
  .study .result { margin: 6px 0 0; padding: 3px 5px; }
  .study .result::before { height: 6px; }
}



html { background: #030305; color-scheme: dark; }
body { background: #030305; color: #f0eeff; }
body.map-ready > .mast { display: none; }
main.wrap { width: 100%; }
.map-viewport {
  position: relative;
  height: calc(100dvh - 84px);
  min-height: 280px;
  overflow: clip;
  background: #030305;
  border-bottom: 1px solid #27243b;
  cursor: grab;
  touch-action: none;
}
.map-viewport:focus-visible { outline: 2px solid #64f6e7; outline-offset: -3px; }
.map-viewport.is-panning, .map-viewport.is-panning .tree-toggle { cursor: grabbing; }
.map-tree { position: absolute; inset: 0 auto auto 0; width: max-content; user-select: none; }
.tree-row {
  --neon: #bc9aff;
  --node-fill: #191125;
  display: flex;
  align-items: center;
  position: relative;
}
.depth-1 { --neon: #6dceff; --node-fill: #0b1a25; }
.depth-2 { --neon: #62f5c5; --node-fill: #0b211e; }
.depth-3 { --neon: #ff9cdb; --node-fill: #231326; }
.tree-box {
  position: relative;
  flex: none;
  width: clamp(205px, 27vw, 264px);
  padding: 14px 26px 14px 15px;
  border: 1px solid color-mix(in srgb, var(--neon) 62%, transparent);
  border-radius: 15px;
  background: var(--node-fill);
  color: #f8f6ff;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.4;
  box-shadow: 0 0 18px color-mix(in srgb, var(--neon) 16%, transparent);
}
.tree-box small { display: block; margin-top: 5px; color: #ccd2e4; font-size: 12px; font-weight: 400; }
.tree-toggle {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  padding: 0 0 2px;
  border-radius: 50%;
  border: 1px solid var(--neon);
  background: #090910;
  color: var(--neon);
  font: 700 22px/1 system-ui, sans-serif;
  cursor: pointer;
}
.tree-toggle:hover { background: var(--neon); color: #07070b; }
.tree-children {
  margin-left: 68px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  animation: grow .25s ease-out;
}
.tree-children[hidden] { display: none; }
.tree-connectors {
  position: absolute;
  right: 100%;
  top: 0;
  width: 68px;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  filter: drop-shadow(0 0 3px var(--neon));
}
.tree-connectors path {
  fill: none;
  stroke: var(--neon);
  stroke-width: 1.7px;
  stroke-linecap: round;
}
@keyframes grow { from { opacity: 0; } to { opacity: 1; } }
.map-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 14px 20px;
  background: #0c0b12;
  color: #ded9f4;
  font-size: .86rem;
}
.map-controls select, .map-controls button {
  font: inherit;
  min-height: 37px;
  max-width: 100%;
  padding: 7px 11px;
  border: 1px solid #423d5a;
  border-radius: 9px;
  color: #f2edff;
  background: #171323;
}
.map-controls button { cursor: pointer; }
.map-controls button:hover, .map-controls select:hover { border-color: #bc9aff; }
.map-hint { margin-left: auto; color: #b3adc8; }
body.map-ready .sources { margin: 0; padding: 12px 20px 22px; }
body.map-ready .sources a, body.map-ready .sources summary { color: #b6aaff; }
@media (prefers-reduced-motion: reduce) { .tree-children { animation: none; } }
@media (max-width: 620px) {
  .map-viewport { height: calc(100dvh - 138px); }
  .map-controls { padding: 10px 12px; }
  .map-hint { width: 100%; margin-left: 0; }
}
@media print {
  html, body { background: white; color: black; color-scheme: light; }
  .map-controls, .tree-toggle { display: none; }
  .map-viewport { height: auto; min-height: 0; overflow: visible; border: 0; background: white; }
  .map-tree { position: static; transform: none !important; zoom: .65; }
  .tree-box { color: #101020; background: #f5f2fc; box-shadow: none; }
  .tree-box small { color: #303447; }
  .tree-connectors { filter: none; }
  body.map-ready .sources a, body.map-ready .sources summary { color: #423663; }
}

html.map-fullscreen { overflow: hidden; }
main.map-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  background: #030305;
}
main.map-fullscreen:fullscreen { height: 100%; }
main.map-fullscreen .map-viewport { height: 100%; min-height: 0; }
main.map-fullscreen .map-controls {
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
main.map-fullscreen .sources, main.map-fullscreen .map-hint { display: none; }
@media print {
  main.map-fullscreen { position: static; display: block; height: auto; background: white; }
  main.map-fullscreen .map-viewport { height: auto; }
  main.map-fullscreen .sources { display: block; }
}


.atlas-dialog { width: min(680px, calc(100% - 24px)); max-height: 80dvh; padding: 18px; border: 1px solid #62538c; border-radius: 14px; background: #12101c; color: #f0eeff; }
.atlas-dialog::backdrop { background: rgb(0 0 0 / .72); }
.dialog-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.dialog-head h2 { font-size:1.25rem; }
.atlas-dialog button, .atlas-dialog input, .source-note-button { font:inherit; background:#221b34; color:#f2ecff; border:1px solid #5b4d77; border-radius:7px; padding:6px 9px; }
.atlas-dialog button, .source-note-button { cursor:pointer; }
.atlas-dialog input { display:block; width:100%; margin:6px 0 9px; }
.atlas-results { margin:8px 0 0; padding:0; list-style:none; }
.atlas-results button { width:100%; margin-bottom:6px; text-align:left; }
.atlas-results small { display:block; color:#bdb3db; }
.atlas-dialog a { color:#a7ecff; }
.atlas-status { margin:8px 0; color:#cec7df; font-size:.84rem; }
.atlas-note-text { white-space:pre-wrap; margin:12px 0; line-height:1.6; user-select:text; }
.source-note-button { display:block; margin-top:8px; padding:2px 6px; font-size:.72rem; }
@media print { .source-note-button, .atlas-dialog { display:none; } }


.tree-box .diagnostic-clue { margin: 0 0 6px; }
.diagnostic-result { color: var(--neon); }
@media print { .diagnostic-result { color:#101020; } }

.tree-box .numeric-cue {color:#fff; font-weight:750;}
@media print { .tree-box .numeric-cue {color:#101020;} }

.disease-details h3 { margin-top: 14px; font-size: 1rem; color: #d5c9ff; }
.disease-details ul, .disease-details ol { margin: 6px 0 0; padding-left: 1.45rem; }
.disease-details li { margin: 0 0 7px; line-height: 1.45; }
.disease-details ol li::marker { font-weight: 750; color: #89f4dd; }
.tree-box .disease-details-button {
  display: block; margin-top: 8px; padding: 4px 8px; font: inherit;
  font-size: .74rem; color: var(--neon); background: transparent;
  border: 1px solid var(--neon); border-radius: 7px; cursor: pointer;
}
.tree-box .disease-details-button:hover { background: #211b32; }
@media print { .disease-details-button { display: none !important; } }

</style>

const raw = "# Biochemistry\n> Molecular\n>> Pyrimidine synthesis\nOrotic aciduria, megaloblastic anemia, normal ammonia | UMP synthase deficiency\n>> Purine salvage deficiencies\nHyperuricemia, dystonia, self-injury, HGPRT deficiency | Lesch–Nyhan syndrome\n> Cellular\n>> Collagen\nFractures with blue sclerae and hearing loss, type I collagen defect | Osteogenesis imperfecta\nHyperextensible skin, hypermobile joints, easy bruising | Ehlers–Danlos syndrome\n>> Elastin\nTall habitus, superotemporal lens displacement, aortic root dilation | Marfan syndrome\n> Genetics\n>> Muscular dystrophies\nChildhood proximal weakness, Gowers sign, calf pseudohypertrophy, absent dystrophin | Duchenne muscular dystrophy\nLater-onset dystrophinopathy with partially functional dystrophin | Becker muscular dystrophy\n> Metabolism\n>> Urea cycle\nHyperammonemia with elevated orotic acid | Ornithine transcarbamylase deficiency\n>> Amino acid metabolism\nMusty odor and elevated phenylalanine | Phenylketonuria\nMaple-syrup odor, elevated branched-chain amino acids and alloisoleucine | Maple syrup urine disease\n>> Galactose metabolism\nInfantile cataracts, jaundice, E. coli sepsis after milk exposure | Classic galactosemia\n>> Glycogen storage diseases\nFasting hypoglycemia, hepatomegaly, lactic acidosis | Von Gierke disease\nInfantile cardiomyopathy, hypotonia, lysosomal acid α-glucosidase deficiency | Pompe disease\nExercise cramps, myoglobinuria, absent lactate rise on exercise | McArdle disease\n>> Lysosomal storage diseases\nCherry-red macula, neurodegeneration, no hepatosplenomegaly | Tay–Sachs disease\nCherry-red macula with hepatosplenomegaly, sphingomyelinase deficiency | Niemann–Pick disease type A\nHepatosplenomegaly, bone pain, macrophages with wrinkled cytoplasm | Gaucher disease\nAngiokeratomas, neuropathic pain, renal and cardiac disease | Fabry disease\n# Immunology\n> Immune Responses\n>> Immunodeficiencies\nBoy with recurrent bacterial infections after maternal IgG wanes, const systems = new Map();
let parents = [];
for (const line of raw.trim().split('\n')) {
  if (line.startsWith('# ')) {
    const name = line.slice(2);
    const chapter = {text: name, children: []};
    systems.set(name, chapter);
    parents = [chapter];
    continue;
  }
  const branch = /^(>+) (.+)$/.exec(line);
  if (branch) {
    const depth = branch[1].length;
    const node = {text: branch[2], children: []};
    parents[depth - 1].children.push(node);
    parents.splice(depth, parents.length - depth, node);
    continue;
  }
  const [clue, diagnosis] = line.split(' | ');
  if (!diagnosis) throw Error('Malformed branch ' + line);
  parents.at(-1).children.push({text: diagnosis, detail: clue, diagnosis: true});
}
const topics = [...systems].map(([label, node], i) => ({id: 'system-' + i, label, node}));

S, impair initiation, and cause mRNA misreading. Uptake requires oxygen.|Nephrotoxicity, ototoxicity, neuromuscular blockade.|Avoid in pregnancy when alternatives are available.\n> Antimicrobials / Protein synthesis inhibitors / Tetracyclines\nTetracycline;Doxycycline;Minocycline;Demeclocycline|Bind 30S and block aminoacyl-tRNA attachment.|Photosensitivity, GI upset, tooth discoloration.|Generally avoid in pregnancy and young children, with drug- and indication-specific exceptions.\n> Antimicrobials / Protein synthesis inhibitors / Glycylcyclines\nTigecycline|Glycylcycline that blocks aminoacyl-tRNA entry at 30S.|Nausea and vomiting.\n> Antimicrobials / Protein synthesis inhibitors / Amphenicols\nChloramphenicol|Inhibits 50S peptidyl transferase.|Aplastic anemia, dose-related marrow suppression, gray baby syndrome.\n> Antimicrobials / Protein synthesis inhibitors / Lincosamides\nClindamycin|Binds 50S and inhibits protein elongation.|C. difficile colitis.\n> Antimicrobials / Protein synthesis inhibitors / Oxazolidinones\nLinezolid|Binds 50S and prevents formation of the initiation complex.|Thrombocytopenia, neuropathy, serotonin syndrome.\n> Antimicrobials / Protein synthesis inhibitors / Macrolides\nAzithromycin;Clarithromycin;Erythromycin|Bind 50S and inhibit translocation.|GI effects, QT prolongation. Erythromycin and clarithromycin inhibit CYP3A4.\n> Antimicrobials / Other antibacterials / Polymyxins\nColistin;Polymyxin B|Disrupt gram-negative bacterial membranes.|Nephrotoxicity, neurotoxicity.\n> Antimicrobials / Other antibacterials / Sulfonamides\nSulfamethoxazole;Sulfadiazine;Sulfisoxazole|Inhibit bacterial dihydropteroate synthase.|Hypersensitivity, Stevens–Johnson syndrome, hemolysis with G6PD deficiency, kernicterus risk.\n> Antimicrobials / Other antibacterials / Sulfones\nDapsone|Inhibits microbial dihydropteroate synthase.|Hemolysis, especially with G6PD deficiency, and methemoglobinemia.\n> Antimicrobials / Other antibacterials / Dihydrofolate reductase inhibitors\nTrimethoprim|Inhibits bacterial dihydrofolate reductase.|Hyperkalemia, marrow suppression, megaloblastic anemia.\n> Antimicrobials / Other antibacterials / Fluoroquinolones\nCiprofloxacin;Ofloxacin;Levofloxacin;Moxifloxacin|Inhibit DNA gyrase and topoisomerase IV.|Tendinopathy, QT prolongation, CNS effects, cartilage toxicity concerns.\n> Antimicrobials / Other antibacterials / Lipopeptides\nDaptomycin|Depolarizes gram-positive cell membranes.|Myopathy, elevated CK.|Avoid for pneumonia because pulmonary surfactant inactivates it.\n> Antimicrobials / Other antibacterials / Nitroimidazoles\nMetronidazole|Reduced in susceptible organisms to radicals that damage DNA.|Metallic taste, GI upset, neuropathy.\n> Antimicrobials / Antimycobacterial therapy / Rifamycins\nRifampin;Rifabutin;Rifapentine|Inhibit bacterial DNA-dependent RNA polymerase.|Orange body fluids, hepatotoxicity, drug interactions from enzyme induction.\n> Antimicrobials / Antimycobacterial therapy / First-line non-rifamycin tuberculosis drugs\nIsoniazid|Activated by KatG and inhibits mycolic acid synthesis.|Hepatotoxicity, peripheral neuropathy from B₆ depletion, drug-induced lupus.\nPyrazinamide|Converted to pyrazinoic acid, active against mycobacteria in acidic environments.|Hepatotoxicity, hyperuricemia.\nEthambutol|Inhibits arabinosyltransferase and disrupts arabinogalactan synthesis.|Optic neuropathy, red–green color impairment.\n> Antimicrobials / Antimycobacterial therapy / Riminophenazines\nClofazimine|Has antimycobacterial activity through mechanisms that include disruption of membrane function.|Skin discoloration, GI effects.\n> Antimicrobials / Antifungal therapy / Polyenes\nAmphotericin B;Nystatin|Bind ergosterol and form fungal membrane pores.|Amphotericin B can cause infusion reactions, nephrotoxicity, hypokalemia, and hypomagnesemia.\n> Antimicrobials / Antifungal therapy / Pyrimidine analogs\nFlucytosine|Fungal cells convert it to 5-FU, impairing DNA and RNA synthesis.|Marrow sturbances, seizures.\n> Antimicrobials / Antiviral therapy / Antiherpes nucleotide analogs\nCidofovir|Host kinases activate nucleotide analog that inhibits viral DNA polymerase.|Nephrotoxicity. Probenecid and hydration reduce renal exposure.\n> Antimicrobials / HIV therapy / Nucleoside and nucleotide reverse transcriptase inhibitors\nAbacavir;Emtricitabine;Lamivudine;Tenofovir disoproxil fumarate;Tenofovir alafenamide;Zidovudine|Activated nucleotide or nucleoside analogs inhibit reverse transcriptase and terminate DNA elongation.\nAbacavir| |Hypersensitivity in susceptible patients.|HLA-B*57:01 positivity or prior abacavir hypersensitivity.\nTenofovir disoproxil fumarate| |Proximal tubulopathy, reduced bone mineral density.\nZidovudine| |Macrocytosis, anemia, neutropenia.\n> Antimicrobials / HIV therapy / Non-nucleoside reverse transcriptase inhibitors\nDoravirine;Efavirenz;Rilpivirine|Allosterically inhibit HIV reverse transcriptase.|Efavirenz can cause CNS effects. Rilpivirine exposure falls with gastric acid suppression.\n> Antimicrobials / HIV therapy / Integrase strand transfer inhibitors\nBictegravir;Dolutegravir;Raltegravir;Elvitegravir|Inhibit HIV integrase strand transfer.|Polyvalent cations can reduce absorption.\n> Antimicrobials / HIV therapy / HIV protease inhibitors\nAtazanavir;Darunavir;Lopinavir;Ritonavir|Inhibit HIV protease, preventing virion maturation. Ritonavir also boosts other agents through CYP3A inhibition.|Metabolic effects and drug interactions. Atazanavir can cause indirect hyperbilirubinemia.\n> Antimicrobials / HIV therapy / Fusion inhibitors\nEnfuvirtide|Binds gp41 and blocks viral fusion.|Injection-site reactions.\n> Antimicrobials / HIV therapy / CCR5 antagonists\nMaraviroc|Blocks CCR5-mediated entry of CCR5-tropic HIV.|Hepatotoxicity.\n> Antimicrobials / Hepatitis C therapy / NS5A inhibitors\nElbasvir;Ledipasvir;Pibrentasvir;Velpatasvir|Inhibit HCV NS5A, disrupting replication and assembly.\n> Antimicrobials / Hepatitis C therapy / NS5B polymerase inhibitors\nSofosbuvir|Nucleotide analog inhibits HCV NS5B RNA polymerase.\n> Antimicrobials / Hepatitis C therapy / NS3/4A protease inhibitors\nGlecaprevir;Grazoprevir|Inhibit HCV NS3/4A protease, blocking viral polyprotein processing.\n> Antimicrobials / Hepatitis C therapy / Antiviral nucleoside analogs\nRibavirin|Nucleoside analog interferes with viral RNA metabolism.|Hemolytic anemia.|Pregnancy.\n# Pharmacology\n> Pharmacokinetics and pharmacodynamics\nDrug disposition|Bioavailability determines systemic exposure. Volume of distribution relates drug amount to plasma concentration. Clearance and volume of distribution determine half-life.\nReceptor binding|Competitive antagonists increase the agonist concentration needed for a given effect. Noncompetitive antagonists can reduce maximal effect. Partial agonists have lower maximal efficacy than full agonists.\n> Autonomic drugs / Cholinomimetic agents / Direct muscarinic agonists\nBethanechol;Carbachol;Methacholine;Pilocarpine|Directly activate muscarinic receptors. Carbachol also activates nicotinic receptors.|Cholinergic effects include sweating, diarrhea, bronchospasm, and bradycardia.\n> Autonomic drugs / Cholinomimetic agents / Acetylcholinesterase inhibitors\nDonepezil;Rivastigmine;Galantamine;Neostigmine;Pyridostigmine;Physostigmine|Inhibit acetylcholinesterase and increase synaptic acetylcholine.|Bradycardia, GI effects, excess secretions.\n> Autonomic drugs / Cholinomimetic agents / Acetylcholinesterase reactivators\nPralidoxime|Reactivates organophosphate-inhibited acetylcholinesterase before aging.\n> Autonomic drugs / Muscarinic antagonists\nAtropine;Homatropine;Tropicamide;Benztropine;Trihexyphenidyl;Glycopyrrolate;Hyoscyamine;Dicyclomine;Ipratropium;Tiotropium;Solifenacin;Oxybutynin;Tolterodine;Scopolamine|Block muscarinic signaling.|Dry mouth, urinary retention, constipation, blurred vision, and confusion with CNS-penetrant agents.\n> Autonomic drugs / Muscarinic antagonists / Urinary antispasmodics\nFlavoxate|Relaxes urinary tract smooth muscle.|Dry mouth, blurred vision.\n> Autonomic drugs / Sympathomimetics / Short-acting β₂ agonists\nAlbuterol|Activate β₂ receptors and relax smooth muscle.|Tremor, tachycardia, hypokalemia.\n> Autonomic drugs / Sympathomimetics / Long-acting β₂ agonists\nSalmeterol|Activate β₂ receptors and relax smooth muscle.|Tremor, tachycardia, hypokalemia.\nFormoterol|Activate β₂ receptors and relax smooth muscle.|Tremor, tachycardia, hypokalemia.\n> Autonomic drugs / Sympathomimetics / Short-acting β₂ agonists\nTerbutaline|Activate β₂ receptors and relax smooth muscle.|Tremor, tachycardia, hypokalemia.\n> Autonomic drugs / Sympathomimetics / β₁ agonists\nDobutamine|Predominantly stimulates cardiac β₁ receptors, increasing contractility.|Tachyarrhythmia.\n> Autonomic drugs / Sympathomimetics / Dopaminergic and adrenergic agonists\nDopamine|Stimulates D₁, then β₁, then α₁ receptors as dose rises.|Tachyarrhythmia.\n> Autonomic drugs / Sympathomimetics / Mixed α and β agonists\nEpinephrine;Norepinephrine|Stimulate adrenergic receptors. Epinephrine has substantial β₂ activity. Norepinephrine predominantly activates α and β₁ receptors.|Tachyarrhythmia, ischemia.\n> Autonomic drugs / Sympathomimetics / D₁ agonists\nFenoldopam|Activates D₁ receptors to cause arterial vasodilation.|Reflex tachycardia, increased intraocular pressure.\n> Autonomic drugs / Sympathomimetics / Nonselective β agonists\nIsoproterenol|Activates β₁ and β₂ receptors.|Tachyarrhythmia.\n> Autonomic drugs / Sympathomimetics / α₁ agonists\nMidodrine;Phenylephrine|Activate α₁ receptors, increasing vascular tone.|Hypertension, reflex bradycardia.\n> Autonomic drugs / Sympathomimetics / β₃ agonists\nMirabegron|Activates β₃ receptors to relax detrusor muscle.|Hypertension.\n> Autonomic drugs / Sympathomimetics / Indirect sympathomimetics\nAmphetamine|Increases synaptic norepinephrine and dopamine release.|Insomnia, hypertension, appetite suppression, dependence.\nCocaine|Blocks monoamine reuptake and voltage-gated sodium channels.|Vasospasm, arrhythmias, seizures.\n> Autonomic drugs / Sympathomimetics / Mixed-acting sympathomimetics\nEphedrine;Pseudoephedrine|Increase adrenergic signaling through direct and indirect effects.|Insomnia, hypertension, tachycardia.\n> Autonomic drugs / Sympatholytics / Central α₂ agonists\nClonidine;Guanfacine;Methyldopa;Tizanidine|Activate central α₂ signaling and reduce sympathetic outflow or motor neuron activity.|Sedation, hypotension. Clonidine withdrawal can cause rebound hypertension. Methyldopa can cause Coombs-positive hemolysis.\n> Autonomic drugs / Sympatholytics / Nonselective α blockers\nPhenoxybenzamine;Phentolamine|Block α₁ and α₂ receptors. Phenoxybenzamine is irreversible.|Orthostatic hypotension, reflex tachycardia.\n> Autonomic drugs / Sympatholytics / α₁ blockers\nPrazosin;Terazosin;Doxazosin;Tamsulosin|Block α₁ receptors. Tamsulosin preferentially targets α₁A receptors.|Orthostasis, first-dose syncope. Tamsulosin can cause ejaculatory dysfunction.\n> Autonomic drugs / Sympatholytics / Nonselective β blockers\nPropranolol;Nadolol;Timolol;Pindolol|Block β₁ and β₂ receptors.|Bradycardia, bronchospasm, masking of hypoglycemia.\n> Autonomic drugs / Sympatholytics / β₁-selective blockers\nAtenolol;Metoprolol;Bisoprolol;Esmolol;Acebutolol;Nebivolol|Preferentially block β₁ receptors.|Bradycardia, AV block, fatigue.\n> Autonomic drugs / Sympatholytics / Combined α and β blockers\nCarvedilol;Labetalol|Block β and α₁ receptors.|Bradycardia, orthostatic hypotension, bronchospasm.\n> Autonomic drugs / Phosphodiesterase inhibitors / PDE5 inhibitors\nSildenafil;Tadalafil;Vardenafil|Inhibit PDE5 and increase cGMP-mediated smooth muscle relaxation.|Headache, flushing, hypotension.|Concurrent nitrates.\n> Autonomic drugs / Phosphodiesterase inhibitors / PDE4 inhibitors\nRoflumilast;Apremilast|Inhibit PDE4 and increase intracellular cAMP.|GI effects, weight loss.\n> Autonomic drugs / Phosphodiesterase inhibitors / PDE3 inhibitors\nMilrinone;Cilostazol|Inhibit PDE3 and increase cAMP. Milrinone increases contractility. Cilostazol inhibits platelet aggregation.|Milrinone can cause arrhythmias and hypotension.|Cilostazol is contraindicated in heart failure.\n> Autonomic drugs / Phosphodiesterase inhibitors / Methylxanthines\nTheophylline;Aminophylline;Caffeine|Methylxanthines antagonize adenosine receptors and can inhibit phosphodiesterases.|Tachycardia, tremor, seizures at toxic concentrations.\n> Toxicities and adverse effects / Specific toxicity treatments / Glutathione precursors\nN-acetylcysteine|Restores glutathione to detoxify acetaminophen's reactive metabolite.\n> Toxicities and adverse effects / Specific toxicity treatments / Alcohol dehydrogenase inhibitors\nFomepizole|Inhibits alcohol dehydrogenase, limiting toxic metabolites of methanol and ethylene glycol.\n> Toxicities and adverse effects / Specific toxicity treatments / Iron chelators\nDeferoxamine;Deferasirox;Deferiprone|Chelate iron and increase its elimination.\n> Toxicities and adverse effects / Specific toxicity treatments / Heavy metal chelators\nDimercaprol;Succimer;Calcium disodium EDTA|Chelate selected heavy metals, including lead with appropriate agent selection.\n> Toxicities and adverse effects / Specific toxicity treatments / Cyanide-binding agents\nHydroxocobalamin|Binds cyanide to form cyanocobalamin.\n> Toxicities and adverse effects / Specific toxicity treatments / Methemoglobinemia reversal agents\nMethylene blue|Facilitates reduction of methemoglobin to functional hemoglobin.|Hemolysis risk in G6PD deficiency.\n> Toxicities and adverse effects / Specific toxicity treatments / Glucagon receptor agonists\nGlucagon|Raises cardiac cAMP independently of β receptors in β-blocker toxicity.\n> Toxicities and adverse effects / Specific toxicity treatments / Heparin reversal agents\nProtamine|Binds and neutralizes unfractionated heparin, and partially reverses LMWH.\n> Toxicities and adverse effects / Specific toxicity treatments / Digoxin-binding antibodies\nDigoxin immune Fab|Binds circulating digoxin.\n> Toxicities and adverse effects / Specific toxicity treatments / Benzodiazepine antagonists\nFlumazenil|Competitively antagonizes the benzodiazepine binding site on GABA-A receptors.|Can precipitate seizures in dependent patients or mixed overdoses.\n# Cardiovascular\n> Hypertension and antianginal therapy / Dihydropyridine calcium channel blockers\nAmlodipine;Clevidipine;Nicardipine;Nifedipine;Nimodipine|Dihydropyridines block vascular L-type calcium channels.|Peripheral edema, flushing, reflex tachycardia.\n> Hypertension and antianginal therapy / Non-dihydropyridine calcium channel blockers\nVerapamil;Diltiazem|Block L-type calcium channels and slow AV nodal conduction.|Bradycardia, AV block. Verapamil causes constipation.|Avoid in systolic heart failure.\n> Hypertension and antianginal therapy / Direct arteriolar vasodilators\nHydralazine|Directly relaxes arteriolar smooth muscle.|Reflex tachycardia, fluid retention, drug-induced lupus.\n> Hypertension and antianginal therapy / Nitrovasodilators\nNitroprusside|Releases nitric oxide, increasing cGMP and dilating arteries and veins.|Cyanide or thiocyanate toxicity.\n> Hypertension and antianginal therapy / Organic nitrates\nNitroglycerin;Isosorbide dinitrate;Isosorbide mononitrate|Increase nitric oxide signaling and cGMP, predominantly reducing preload.|Headache, hypotension, tolerance.|Concurrent PDE5 inhibitors.\n> Hypertension and antianginal therapy / Late sodium current inhibitors\nRanolazine|Inhibits late inward sodium current, reducing diastolic wall tension.|QT prolongation, dizziness, constipation.\n> Hypertension and antianginal therapy / Neprilysin inhibitors\nSacubitril|Inhibits neprilysin and increases natriuretic peptide activity. Used with valsartan.|Hypotension, hyperkalemia, angioedema.|Concurrent ACE inhibition. Separate by at least 36 hours.\n> Lipid-lowering agents / Statins\nAtorvastatin;Lovastatin;Pravastatin;Rosuvastatin;Simvastatin|Inhibit HMG-CoA reductase and increase hepatic LDL receptor expression.|Myopathy, increased aminotransferases.\n> Lipid-lowering agents / Bile acid sequestrants\nCholestyramine;Colesevelam;Colestipol|Bind bile acids in the gut and increase hepatic LDL clearance.|Constipation, reduced absorption of other drugs and fat-soluble vitamins, elevated triglycerides.\n> Lipid-lowering agents / Cholesterol absorption inhibitors\nEzetimibe|Blocks NPC1L1-mediated intestinal cholesterol uptake.|GI effects, increased liver enzymes with statins.\n> Lipid-lowering agents / Fibrates\nGemfibrozil;Fenofibrate|Activate PPAR-α and increase lipoprotein lipase activity.|Gallstones, myopathy, especially gemfibrozil with statins.\n> Lipid-lowering agents / Nicotinic acid\nNiacin|Reduces hepatic VLDL synthesis and adipose lipolysis.|Flushing, hyperuricemia, hyperglycemia, hepatotoxicity.\n> Lipid-lowering agents / PCSK9 monoclonal antibodies\nAlirocumab;Evolocumab|Inhibit PCSK9, increasing LDL receptor recycling.|Injection-site reactions.\n> Lipid-lowering agents / Omega-3 fatty acids\nIcosapent ethyl;Omega-3 fatty acids|Reduce hepatic triglyceride-rich lipoprotein production.|GI effects. Icosapent ethyl can increase atrial fibrillation and bleeding risk.\n> Antiarrhythmics / Cardiac glycosides\nDigoxin|Inhibits Na⁺/K⁺-ATPase, increasing intracellular calcium. Increases vagal tone at the AV node.|Nausea, visual changes, arrhythmias. Hypokalemia increases toxicity risk.\n> Antiarrhythmics / Class IA sodium channel blockers\nQuinidine;Procainamide;Disopyramide|Class IA sodium-channel blockers that also prolong repolarization.|Torsades. Quinidine causes cinchonism, procainamide can cause lupus, and disopyramide has antimuscarinic effects.\n> Antiarrhythmics / Class IB sodium channel blockers\nLidocaine;Mexiletine|Class IB sodium-channel blockers preferentially act in depolarized or ischemic tissue.|CNS effects, including seizures with lidocaine toxicity.\n> Antiarrhythmics / Class IC sodium channel blockers\nFlecainide;Propafenone|Class IC sodium-channel blockers markedly slow conduction.|Proarrhythmia.|Avoid with prior MI or significant structural heart disease.\n> Antiarrhythmics / Class III potassium channel blockers\nAmiodarone;Dronedarone;Sotalol;Dofetilide;Ibutilide|Class III drugs prolong repolarization by blocking potassium currents.|QT prolongation. Amiodarone can cause lung, thyroid, liver, corneal, and skin toxicity.\n> Antiarrhythmics / Adenosine receptor agonists\nAdenosine|Activates A₁ receptors, transiently slowing AV nodal conduction.|Flushing, chest discomfort, bronchospasm.\n> Antiarrhythmics / Electrolytes\nMagnesium sulfate|Suppresses triggered activity in torsades de pointes.|Excess exposure can cause hyporeflexia and respiratory depression.\n> Antiarrhythmics / Funny current inhibitors\nIvabradine|Inhibits the funny current in the sinoatrial node.|Bradycardia, luminous visual phenomena.\n# Endocrine\n> Diabetes mellitus therapy / Rapid-acting insulins\nInsulin lispro|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\nInsulin aspart|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\nInsulin glulisine|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\n> Diabetes mellitus therapy / Short-acting insulins\nRegular insulin|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\n> Diabetes mellitus therapy / Intermediate-acting insulins\nNPH insulin|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\n> Diabetes mellitus therapy / Long-acting insulins\nInsulin detemir|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\nInsulin glargine|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\n> Diabetes mellitus therapy / Ultra-long-acting insulins\nInsulin degludec|Activate the insulin receptor to increase glucose uptake and reduce hepatic glucose production.|Hypoglycemia, weight gain, hypokalemia.\n> Diabetes mellitus therapy / Biguanides\nMetformin|Reduces hepatic gluconeogenesis and improves insulin sensitivity.|GI upset, vitamin B₁₂ deficiency, rare lactic acidosis.|eGFR below 30 mL/min/1.73 m².\n> Diabetes mellitus therapy / Thiazolidinediones\nPioglitazone|Activates PPAR-γ to improve insulin sensitivity.|Weight gain, edema, fractures.|Avoid initiation in NYHA class III–IV heart failure.\n> Diabetes mellitus therapy / Sulfonylureas\nChlorpropamide;Glipizide;Glyburide;Glimepiride|Close β-cell ATP-sensitive potassium channels and increase insulin secretion.|Hypoglycemia, weight gain.\n> Diabetes mellitus therapy / Meglitinides\nNateglinide;Repaglinide|Close β-cell ATP-sensitive potassium channels to increase short-acting insulin release.|Hypoglycemia, weight gain.\n> Diabetes mellitus therapy / GLP-1 receptor agonists\nExenatide;Liraglutide;Dulaglutide;Semaglutide;Lixisenatide|Activate GLP-1 receptors, increasing glucose-dependent insulin release and slowing gastric emptying.|Nausea, vomiting, pancreatitis warning. Some agents have thyroid C-cell tumor warnings.\n> Diabetes mellitus therapy / Dual GIP and GLP-1 receptor agonists\nTirzepatide|Activates GIP and GLP-1 receptors.|GI effects.|Personal or family history of medullary thyroid carcinoma or MEN2.\n> Diabetes mellitus therapy / DPP-4 inhibitors\nLinagliptin;Saxagliptin;Sitagliptin;Alogliptin|Inhibit DPP-4 and prolong endogenous incretin signaling.|Pancreatitis, severe arthralgia. Heart failure warning for saxagliptin and alogliptin.\n> Diabetes mellitus therapy / SGLT2 inhibitors\nCanagliflozin;Dapagliflozin;Empagliflozin;Ertugliflozin|Inhibit proximal tubular SGLT2, increasing urinary glucose excretion.|Genital mycosis, volume depletion, euglycemic ketoacidosis.\n> Diabetes mellitus therapy / α-Glucosidase inhibitors\nAcarbose;Miglitol|Inhibit intestinal α-glucosidases and delay carbohydrate absorption.|Flatulence, diarrhea.\n> Diabetes mellitus therapy / Amylin analogs\nPramlintide|Amylin analog slows gastric emptying and suppresses postprandial glucagon.|Nausea and hypoglycemia with insulin.\n> Thyroid and hypothalamic/pituitary drugs / Thionamides\nMethimazole;Propylthiouracil|Inhibit thyroid peroxidase. Propylthiouracil also inhibits peripheral T₄-to-T₃ conversion.|Agranulocytosis. Propylthiouracil can cause severe hepatotoxicity. Methimazole has first-trimester teratogenic risk.\n> Thyroid and hypothalamic/pituitary drugs / Thyroid hormone replacement\nLevothyroxine;Liothyronine|Replace thyroid hormone as T₄ or T₃, respectively.|Overreplacement causes tachycardia, arrhythmias, and bone loss.\n> Thyroid and hypothalamic/pituitary drugs / Vasopressin receptor antagonists\nConivaptan;Tolvaptan|Block vasopressin receptors and increase free water excretion.|Thirst, overly rapid sodium correction. Tolvaptan can cause liver injury.\n> Thyroid and hypothalamic/pituitary drugs / V₂ receptor agonists\nDesmopressin|Activates V₂ receptors, increasing water reabsorption and release of vWF and factor VIII.|Hyponatremia.\n> Thyroid and hypothalamic/pituitary drugs / Oxytocin receptor agonists\nOxytocin|Activates uterine oxytocin receptors to promote contractions.|Uterine tachysystole, water intoxication.\n> Thyroid and hypothalamic/pituitary drugs / Somatostatin analogs\nOctreotide|Somatostatin analog suppresses GH and multiple GI hormones.|GI upset, gallstones, glucose disturbances.\n> Thyroid and hypothalamic/pituitary drugs / Mineralocorticoids\nFludrocortisone|Activates mineralocorticoid receptors to increase sodium retention and potassium excretion.|Hypertension, edema, hypokalemia.\n> Thyroid and hypothalamic/pituitary drugs / Calcimimetics\nCinacalcet|Increases calcium-sensing receptor sensitivity, lowering PTH secretion.|Hypocalcemia, nausea.\n> Thyroid and hypothalamic/pituitary drugs / Phosphate binders\nSevelamer|Binds intestinal phosphate and reduces absorption.|GI effects.\n> Thyroid and hypothalamic/pituitary drugs / Potassium binders\nSodium polystyrene sulfonate;Patiromer;Sodium zirconium cyclosilicate|Bind potassium in the GI tract and increase fecal elimination.|Sodium polystyrene sulfonate can cause serious GI injury. Patiromer can cause hypomagnesemia.\n# Gastrointestinal\n> Acid suppression therapy / H₂ receptor antagonists\nFamotidine;Cimetidine;Nizatidine|Block H₂ receptors on gastric parietal cells.|Cimetidine inhibits CYP450, can cause gynecomastia, and increases serum creatinine by inhibiting tubular secretion.\n> Acid suppression therapy / Proton pump inhibitors\nOmeprazole;Esomeprazole;Pantoprazole;Lansoprazole;Rabeprazole|Irreversibly inhibit the gastric H⁺/K⁺-ATPase.|Hypomagnesemia, C. difficile risk, and possible fracture risk with prolonged use.\n> Acid suppression therapy / Antacids\nAluminum hydroxide|Neutralizes gastric acid.|Constipation, hypophosphatemia.\nCalcium carbonate|Neutralizes gastric acid.|Constipation, hypercalcemia, milk-alkali syndrome.\nMagnesium hydroxide|Neutralizes gastric acid and draws water into the intestine.|Diarrhea, hypermagnesemia in renal impairment.\n> Acid suppression therapy / Mucosal protectants\nBismuth subsalicylate|Coats mucosa and has antimicrobial and antisecretory effects.|Black stool or tongue, salicylate toxicity.\nSucralfate|Forms a protective barrier over damaged mucosa in an acidic environment.|Constipation, reduced absorption of some drugs.\n> Acid suppression therapy / Prostaglandin analogs\nMisoprostol|PGE₁ analog increases mucosal protection and reduces acid secretion.|Diarrhea, uterine contractions.|Pregnancy when used for NSAID ulcer prevention.\n> Antiemetics and intestinal drugs / 5-HT₃ antagonists\nOndansetron;Granisetron;Palonosetron|Block 5-HT₃ receptors.|Headache, constipation, QT prolongation.\n> Antiemetics and intestinal drugs / D₂ antagonists\nProchlorperazine;Metoclopramide|Block dopamine D₂ receptors. Metoclopramide also promotes gastric motility.|Extrapyramidal symptoms, hyperprolactinemia, tardive dyskinesia.\n> Antiemetics and intestinal drugs / NK₁ antagonists\nAprepitant;Fosaprepitant|Block substance P at NK₁ receptors.|Drug interactions through CYP3A4.\n> Antiemetics and intestinal drugs / Opioid antidiarrheals\nLoperamide;Diphenoxylate|Activate enteric μ-opioid receptors and slow intestinal transit.|Constipation. Excess loperamide can cause serious arrhythmias.\n> Antiemetics and intestinal drugs / Aminosalicylates\nSulfasalazine|Colonic bacteria release 5-ASA and sulfapyridine, decreasing intestinal inflammation.|GI upset, rash, folate deficiency, reversible oligospermia.\n> Antiemetics and intestinal drugs / Lipase inhibitors\nOrlistat|Inhibits gastric and pancreatic lipases.|Steatorrhea, reduced fat-soluble vitamin absorption.\n> Anticonstipation drugs / Bulk-forming laxatives\nMethylcellulose;Psyllium|Absorb water and increase stool bulk.|Bloating.\n> Anticonstipation drugs / Osmotic laxatives\nLactulose;Polyethylene glycol;Magnesium citrate|Retain water in the bowel by osmotic action. Lactulose also reduces ammonia absorption.|Bloating, diarrhea, electrolyte disturbances.\n> Anticonstipation drugs / Stimulant laxatives\nBisacodyl;Senna|Stimulate colonic motility and secretion.|Cramping, diarrhea.\n> Anticonstipation drugs / Stool softeners\nDocusate|Surfactant facilitates penetration of water into stool.\n> Anticonstipation drugs / Chloride channel activators\nLubiprostone|Increases intestinal chloride secretion and luminal fluid.|Nausea, diarrhea.\n> Anticonstipation drugs / Guanylate cyclase-C agonists\nLinaclotide;Plecanatide|Activate guanylate cyclase-C, increasing CFTR-mediated secretion.|Diarrhea.\n> Anticonstipation drugs / 5-HT₄ agonists\nPrucalopride|Activates 5-HT₄ receptors to increase colonic motility.|Headache, GI effects.\n> Anticonstipation drugs / NHE3 inhibitors\nTenapanor|Inhibits intestinal NHE3, reducing sodium absorption and increasing stool water.|Diarrhea.\n# Hematology and Oncology\n> Anticoagulation and reversal / Unfractionated heparin\nUnfractionated heparin|Potentiate antithrombin. UFH inhibits factor IIa and Xa. LMWH preferentially inhibits Xa.|Bleeding, HIT, osteoporosis with prolonged use.\n> Anticoagulation and reversal / Low-molecular-weight heparins\nEnoxaparin|Potentiate antithrombin. UFH inhibits factor IIa and Xa. LMWH preferentially inhibits Xa.|Bleeding, HIT, osteoporosis with prolonged use.\nDalteparin|Potentiate antithrombin. UFH inhibits factor IIa and Xa. LMWH preferentially inhibits Xa.|Bleeding, HIT, osteoporosis with prolonged use.\n> Anticoagulation and reversal / Indirect factor Xa inhibitors\nFondaparinux|Potentiates antithrombin-mediated factor Xa inhibition.|Bleeding.\n> Anticoagulation and reversal / Vitamin K antagonists\nWarfarin|Inhibits vitamin K epoxide reductase, reducing activation of II, VII, IX, X, protein C and protein S.|Bleeding, skin necrosis, fetal toxicity.|Generally avoid in pregnancy, with specialized exceptions for some mechanical heart valves.\n> Anticoagulation and reversal / Direct thrombin inhibitors\nArgatroban;Bivalirudin;Dabigatran|Directly inhibit thrombin.|Bleeding.\n> Anticoagulation and reversal / Direct factor Xa inhibitors\nApixaban;Edoxaban;Rivaroxaban|Directly inhibit factor Xa.|Bleeding.\n> Anticoagulation and reversal / Warfarin reversal agents\nVitamin K;Four-factor prothrombin complex concentrate|Reverse warfarin by restoring vitamin K-dependent factor production or supplying those factors directly, respectively.\n> Anticoagulation and reversal / Direct thrombin inhibitor reversal agents\nIdarucizumab|Antibody fragment binds dabigatran to reverse anticoagulation.\n> Anticoagulation and reversal / Factor Xa inhibitor reversal agents\nAndexanet alfa|Modified factor Xa decoy binds selected direct Xa inhibitors.|Thrombotic events.\n> Antiplatelets and thrombolytics / COX inhibitors\nAspirin|Irreversibly inhibits platelet COX-1, reducing thromboxane A₂.|GI bleeding, tinnitus, Reye syndrome risk in children with viral illness.\n> Antiplatelets and thrombolytics / P2Y₁₂ inhibitors\nClopidogrel;Prasugrel;Ticagrelor|Block platelet P2Y₁₂ signaling. Ticagrelor is reversible.|Bleeding. Ticagrelor can cause dyspnea.|Prasugrel is contraindicated with prior stroke or TIA.\n> Antiplatelets and thrombolytics / GP IIb/IIIa inhibitors\nEptifibatide;Tirofiban;Abciximab|Inhibit platelet GP IIb/IIIa, preventing fibrinogen-mediated aggregation.|Bleeding, thrombocytopenia.\n> Antiplatelets and thrombolytics / Phosphodiesterase inhibitors\nDipyridamole|Inhibits adenosine uptake and phosphodiesterase, increasing platelet cAMP.|Headache, flushing, hypotension.\n> Antiplatelets and thrombolytics / Thrombolytics\nAlteplase;Reteplase;Tenecteplase|Activate plasminogen to plasmin, degrading fibrin thrombi.|Bleeding, including intracranial hemorrhage.|Active internal bleeding. Other exclusions vary by indication.\n> Antitumor antibiotics and antimetabolites / Antitumor antibiotics\nBleomycin|Generates free radicals and causes DNA strand breaks.|Pulmonary fibrosis, skin toxicity.\nDactinomycin|Intercalates DNA and inhibits transcription.|Myelosuppression, mucositis.\n> Antitumor antibiotics and antimetabolites / Anthracyclines\nDoxorubicin;Daunorubicin|Intercalate DNA, inhibit topoisomerase II, and generate free radicals.|Cardiomyopathy, myelosuppression.\n> Antitumor antibiotics and antimetabolites / Purine antimetabolites\n6-Mercaptopurine|Thio-purine metabolites inhibit de novo purine synthesis.|Myelosuppression, hepatotoxicity. Xanthine oxidase inhibitors increase exposure.\nCladribine;Pentostatin|Disrupt purine metabolism and damage lymphocytes through distinct mechanisms.|Myelosuppression, infections.\n> Antitumor antibiotics and antimetabolites / Pyrimidine antimetabolites\nCytarabine|Pyrimidine analog inhibits DNA polymerase.|Myelosuppression, cerebellar toxicity.\n5-Fluorouracil;Capecitabine|Active 5-FU metabolite inhibits thymidylate synthase.|Myelosuppression, mucositis, diarrhea, hand-foot syndrome.\n> Antitumor antibiotics and antimetabolites / Ribonucleotide reductase inhibitors\nHydroxyurea|Inhibits ribonucleotide reductase and increases fetal hemoglobin.|Myelosuppression.\n> Antitumor antibiotics and antimetabolites / Antifolates\nMethotrexate|Inhibits dihydrofolate reductase, reducing nucleotide synthesis.|Myelosuppression, mucositis, hepatotoxicity, pulmonary toxicity.|Pregnancy for non-neoplastic uses.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Alkyl sulfonates\nBusulfan|Alkylates and cross-links DNA.|Pulmonary fibrosis, myelosuppression.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Nitrogen mustards\nCyclophosphamide;Ifosfamide|Form DNA cross-links.|Myelosuppression, hemorrhagic cystitis from acrolein.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Nitrosoureas\nCarmustine;Lomustine|Lipid-soluble nitrosoureas alkylate DNA and enter the CNS.|Delayed myelosuppression.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Methylating agents\nProcarbazine|Reactive metabolites damage DNA.|Myelosuppression, MAOI-like food and drug interactions.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Platinum compounds\nCisplatin;Carboplatin;Oxaliplatin|Form platinum-DNA cross-links.|Cisplatin causes nephrotoxicity and ototoxicity. Carboplatin causes myelosuppression. Oxaliplatin causes cold-triggered neuropathy.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Taxanes\nPaclitaxel;Docetaxel|Stabilize microtubules and prevent depolymerization.|Neuropathy, myelosuppression.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Vinca alkaloids\nVincristine;Vinblastine|Prevent microtubule polymerization.|Vincristine causes peripheral neuropathy and ileus. Vinblastine causes myelosuppression.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Topoisomerase I inhibitors\nIrinotecan;Topotecan|Inhibit topoisomerase I.|Myelosuppression. Irinotecan can cause severe diarrhea.\n> Alkylating agents, microtubule and topoisomerase inhibitors / Topoisomerase II inhibitors\nEtoposide;Teniposide|Inhibit topoisomerase II.|Myelosuppression, secondary leukemia risk.\n> Anticancer monoclonal antibodies / CD52 antibodies\nAlemtuzumab|Targets CD52, depleting lymphocytes.|Infusion reactions, opportunistic infections.\n> Anticancer monoclonal antibodies / VEGF antibodies\nBevacizumab|Neutralizes VEGF-A, inhibiting angiogenesis.|Hypertension, bleeding, impaired wound healing, GI perforation.\n> Anticancer monoclonal antibodies / EGFR antibodies\nCetuximab;Panitumumab|Block EGFR signaling.|Acneiform rash, hypomagnesemia.\n> Anticancer monoclonal antibodies / CD20 antibodies\nRituximab|Targets CD20 and depletes B cells.|Infusion reactions, HBV reactivation.\n> Anticancer monoclonal antibodies / HER2 antibodies\nTrastuzumab|Targets HER2 and reduces growth signaling.|Cardiac dysfunction.\n> Anticancer monoclonal antibodies / PD-1 inhibitors\nPembrolizumab;Nivolumab;Cemiplimab|Block PD-1 to increase antitumor T-cell activity.|Immune-mediated inflammation, including colitis, pneumonitis, and endocrinopathies.\n> Anticancer monoclonal antibodies / PD-L1 inhibitors\nAtezolizumab;Durvalumab;Avelumab|Block PD-L1, restoring antitumor T-cell activity.|Immune-mediated adverse reactions.\n> Anticancer monoclonal antibodies / CTLA-4 inhibitors\nIpilimumab|Blocks CTLA-4 and increases T-cell activation.|Immune-mediated adverse reactions, especially colitis.\n> Anticancer small molecule inhibitors / ALK inhibitors\nAlectinib;Crizotinib|Inhibit ALK signaling. Crizotinib also inhibits ROS1 and MET.|Hepatotoxicity, bradycardia.\n> Anticancer small molecule inhibitors / EGFR inhibitors\nErlotinib;Gefitinib;Osimertinib|Inhibit EGFR tyrosine kinase.|Rash, diarrhea, interstitial lung disease.\n> Anticancer small molecule inhibitors / BCR::ABL1 inhibitors\nImatinib;Dasatinib;Nilotinib|Inhibit BCR::ABL1 tyrosine kinase.|Myelosuppression. Imatinib can cause edema, dasatinib pleural effusion, and nilotinib QT prolongation.\n> Anticancer small molecule inhibitors / JAK inhibitors\nRuxolitinib|Inhibits JAK1 and JAK2.|Cytopenias, infections.\n> Anticancer small molecule inhibitors / Proteasome inhibitors\nBortezomib;Ixazomib;Carfilzomib|Inhibit proteasome activity.|Cytopenias. Bortezomib can cause peripheral neuropathy.\n> Anticancer small molecule inhibitors / BRAF inhibitors\nVemurafenib;Dabrafenib|Inhibit mutant BRAF signaling.|Rash, secondary cutaneous malignancies.\n> Anticancer small molecule inhibitors / CDK4/6 inhibitors\nPalbociclib|Inhibits CDK4/6, blocking progression through G₁.|Neutropenia.\n> Anticancer small molecule inhibitors / PARP inhibitors\nOlaparib|Inhibits PARP-mediated repair, especially toxic to homologous-recombination-deficient tumors.|Anemia, nausea.\n> Chemotoxicity amelioration / Cytoprotective agents\nAmifostine|Active thiol scavenges reactive metabolites and reduces cisplatin nephrotoxicity.|Hypotension, nausea.\nDexrazoxane|Reduces anthracycline-associated cardiotoxicity.\n> Chemotoxicity amelioration / Reduced folates\nLeucovorin|Reduced folate bypasses DHFR inhibition after methotrexate and potentiates 5-FU when combined with it.\n> Chemotoxicity amelioration / Uroprotective agents\nMesna|Binds acrolein in urine to protect bladder mucosa.\n> Chemotoxicity amelioration / Uricase agents\nRasburicase|Converts uric acid to more soluble allantoin.|Hemolysis, methemoglobinemia in susceptible patients.|G6PD deficiency.\n# Musculoskeletal, Skin, and Connective Tissue\n> Arachidonic acid pathways and anti-inflammatory agents / Non-opioid analgesics\nAcetaminophen|Analgesic and antipyretic with predominantly central actions.|Overdose produces NAPQI-mediated hepatotoxicity.\n> Arachidonic acid pathways and anti-inflammatory agents / Selective COX-2 inhibitors\nCelecoxib|Selectively inhibits COX-2.|Cardiovascular thrombotic risk, renal injury, GI effects.\n> Arachidonic acid pathways and anti-inflammatory agents / Nonselective NSAIDs\nIbuprofen;Naproxen;Indomethacin;Ketorolac;Diclofenac|Inhibit COX and reduce prostaglandin synthesis.|GI ulcers and bleeding, renal injury, cardiovascular effects.\n> Arachidonic acid pathways and anti-inflammatory agents / Conventional DMARDs\nLeflunomide|Inhibits dihydroorotate dehydrogenase, reducing pyrimidine synthesis in activated lymphocytes.|Hepatotoxicity, GI effects.|Pregnancy.\n> Bone and gout drugs / Bisphosphonates\nAlendronate;Risedronate;Ibandronate;Zoledronic acid|Inhibit osteoclast-mediated bone resorption.|Esophagitis with oral agents, osteonecrosis of the jaw, atypical femur fractures.\n> Bone and gout drugs / PTH receptor agonists\nTeriparatide;Abaloparatide|Intermittent PTH receptor activation favors bone formation.|Hypercalcemia, dizziness.\n> Bone and gout drugs / Xanthine oxidase inhibitors\nAllopurinol;Febuxostat|Inhibit xanthine oxidase and reduce urate production.|Gout flares on initiation. Allopurinol can cause severe hypersensitivity.\n> Bone and gout drugs / Uricase agents\nPegloticase|Converts urate to allantoin.|Infusion reactions, anaphylaxis.|G6PD deficiency.\n> Bone and gout drugs / Uricosurics\nProbenecid|Inhibits proximal tubular urate reabsorption, increasing uric acid excretion.|Uric acid stones, drug interactions.\n> Bone and gout drugs / Microtubule inhibitors\nColchicine|Inhibits microtubule polymerization and neutrophil activity.|Diarrhea, myopathy, marrow suppression.\n> TNF-α inhibitors and psoriasis / TNF-α inhibitors\nEtanercept;Adalimumab;Infliximab|Block TNF-α signaling. Etanercept is a soluble receptor fusion protein.|Serious infections and latent TB or HBV reactivation.\n> TNF-α inhibitors and psoriasis / IL-17A inhibitors\nSecukinumab;Ixekizumab|Block IL-17A signaling.|Infections, including mucocutaneous candidiasis.\n> TNF-α inhibitors and psoriasis / IL-12/23 inhibitors\nUstekinumab|Targets the common p40 subunit of IL-12 and IL-23.|Infections.\n> TNF-α inhibitors and psoriasis / IL-23 inhibitors\nGuselkumab;Risankizumab|Block IL-23 p19 signaling.|Infections.\n> TNF-α inhibitors and psoriasis / TLR7 agonists\nImiquimod|Activates TLR7 and stimulates local innate immunity.|Local erythema, erosion, irritation.\n# Neurology and Special Senses\n> Anticonvulsants / Sodium channel modulators\nPhenytoin;Fosphenytoin|Prolong inactivation of voltage-gated sodium channels.|Nystagmus, ataxia, gingival hyperplasia, hirsutism, teratogenicity.\nCarbamazepine;Oxcarbazepine|Prolong inactivation of voltage-gated sodium channels.|Hyponatremia, serious rash. Carbamazepine can cause marrow suppression and induces CYP enzymes.\n> Anticonvulsants / Gabapentinoids\nGabapentin;Pregabalin|Bind α₂δ subunits of voltage-gated calcium channels, reducing neurotransmitter release.|Sedation, dizziness, peripheral edema.\n> Anticonvulsants / T-type calcium channel blockers\nEthosuximide|Blocks thalamic T-type calcium currents.|GI upset, fatigue, headache.\n> Anticonvulsants / Broad-spectrum agents with multiple targets\nValproate|Increases GABA signaling and modulates sodium and T-type calcium channels.|Hepatotoxicity, pancreatitis, weight gain, neural tube defects.|Avoid in pregnancy whenever possible. Contraindicated for migraine prevention in pregnancy.\n> Anticonvulsants / Sodium channel modulators\nLamotrigine|Blocks voltage-gated sodium channels and reduces glutamate release.|Serious rash, including Stevens–Johnson syndrome.\n> Anticonvulsants / SV2A ligands\nLevetiracetam|Binds synaptic vesicle protein SV2A.|Somnolence, irritability, behavioral changes.\n> Anticonvulsants / Broad-spectrum agents with multiple targets\nTopiramate|Modulates sodium channels, GABA and glutamate signaling, and inhibits carbonic anhydrase.|Cognitive slowing, weight loss, paresthesias, kidney stones, metabolic acidosis.\n> Anticonvulsants / Barbiturates\nPhenobarbital;Pentobarbital;Thiopental|Barbiturates prolong the duration of GABA-A chloride channel opening.|Respiratory depression, sedation, CYP induction.|Porphyria.\n> Anticonvulsants / Benzodiazepines\nDiazepam;Lorazepam;Midazolam;Clonazepam;Alprazolam;Temazepam;Triazolam;Chlordiazepoxide;Oxazepam|Benzodiazepines increase the frequency of GABA-A chloride channel opening.|Sedation, dependence, respiratory depression with other depressants.\n> Insomnia and migraine therapy / Nonbenzodiazepine hypnotics\nZolpidem;Zaleplon;Eszopiclone|Modulate GABA-A receptors at the benzodiazepine site with hypnotic effects.|Sedation, complex sleep behaviors.\n> Insomnia and migraine therapy / Orexin receptor antagonists\nSuvorexant|Blocks orexin receptors, reducing wakefulness.|Daytime somnolence.|Narcolepsy.\n> Insomnia and migraine therapy / Melatonin receptor agonists\nRamelteon|Activates melatonin MT₁ and MT₂ receptors.|Dizziness, somnolence.\n> Insomnia and migraine therapy / Triptans\nSumatriptan;Zolmitriptan;Rizatriptan|Activate 5-HT₁B/₁D receptors, reducing trigeminal signaling and causing vasoconstriction.|Paresthesias, chest pressure.|Ischemic vascular disease, uncontrolled hypertension.\n> Parkinson disease and neurodegenerative disease therapy / Dopamine agonists\nPramipexole;Ropinirole;Rotigotine;Bromocriptine;Apomorphine|Stimulate dopamine receptors.|Orthostasis, hallucinations, impulse control disorders, somnolence.\n> Parkinson disease and neurodegenerative disease therapy / Dopamine precursors\nLevodopa|Crosses the blood-brain barrier and is converted to dopamine.|Dyskinesias, wearing-off, hallucinations.\n> Parkinson disease and neurodegenerative disease therapy / Peripheral dopa decarboxylase inhibitors\nCarbidopa|Inhibits peripheral dopa decarboxylase, increasing levodopa delivery to the brain.\n> Parkinson disease and neurodegenerative disease therapy / COMT inhibitors\nEntacapone;Tolcapone|Inhibit COMT and prolong levodopa availability.|Diarrhea, dyskinesia. Tolcapone can cause severe hepatotoxicity.\n> Parkinson disease and neurodegenerative disease therapy / MAO-B inhibitors\nSelegiline;Rasagiline|Inhibit MAO-B, reducing dopamine breakdown.|Insomnia and drug interactions.\n> Parkinson disease and neurodegenerative disease therapy / Dopaminergic modulators\nAmantadine|Modulates dopaminergic signaling and antagonizes NMDA receptors.|Livedo reticularis, edema, confusion.\n> Parkinson disease and neurodegenerative disease therapy / NMDA antagonists\nMemantine|Blocks NMDA receptors, reducing excessive glutamate signaling.|Dizziness, confusion.\n> Parkinson disease and neurodegenerative disease therapy / Glutamate modulators\nRiluzole|Reduces glutamatergic signaling through several actions.|Elevated aminotransferases.\n> Parkinson disease and neurodegenerative disease therapy / Free radical scavengers\nEdaravone|Scavenges free radicals.|Hypersensitivity.\n> Parkinson disease and neurodegenerative disease therapy / VMAT2 inhibitors\nTetrabenazine;Deutetrabenazine|Inhibit VMAT2, decreasing presynaptic monoamine storage.|Depression, parkinsonism.\n> Anesthetics and neuromuscular blocking drugs / Local anesthetics\nLidocaine;Bupivacaine;Mepivacaine;Procaine;Tetracaine;Benzocaine|Block voltage-gated sodium channels and prevent impulse propagation.|CNS toxicity, seizures, arrhythmias. Bupivacaine is notably cardiotoxic. Benzocaine can cause methemoglobinemia.\n> Anesthetics and neuromuscular blocking drugs / Inhaled anesthetics\nSevoflurane;Desflurane;Isoflurane|Volatile inhaled anesthetics enhance inhibitory and reduce excitatory signaling.|Hypotension, malignant hyperthermia in susceptible patients.\nNitrous oxide|Inhaled anesthetic with NMDA antagonism.|Expansion of closed gas spaces, functional B₁₂ inactivation.\n> Anesthetics and neuromuscular blocking drugs / Intravenous anesthetics\nPropofol|Potentiates GABA-A signaling.|Hypotension, apnea, propofol infusion syndrome with prolonged high-dose exposure.\nEtomidate|Potentiates GABA-A signaling.|Adrenal suppression, myoclonus.\nKetamine|Blocks NMDA receptors, producing dissociative anesthesia.|Emergence reactions, hypertension, increased secretions.\n> Anesthetics and neuromuscular blocking drugs / Depolarizing neuromuscular blockers\nSuccinylcholine|Activates nicotinic receptors, causing sustained depolarization and paralysis.|Hyperkalemia, malignant hyperthermia, prolonged apnea in pseudocholinesterase deficiency.\n> Anesthetics and neuromuscular blocking drugs / Nondepolarizing neuromuscular blockers\nRocuronium;Vecuronium;Pancuronium;Cisatracurium|Competitively block nicotinic receptors at the neuromuscular junction.|Residual weakness and respiratory paralysis.\n> Anesthetics and neuromuscular blocking drugs / Neuromuscular blockade reversal agents\nSugammadex|Encapsulates rocuronium and vecuronium to reverse blockade.\n> Skeletal muscle relaxants and opioid analgesics / Centrally acting muscle relaxants\nBaclofen|Activates GABA-B receptors, reducing excitatory spinal transmission.|Sedation, weakness. Abrupt withdrawal can be severe.\nCyclobenzaprine|Centrally reduces tonic skeletal muscle activity.|Sedation, antimuscarinic effects.\n> Skeletal muscle relaxants and opioid analgesics / Ryanodine receptor inhibitors\nDantrolene|Inhibits RYR1-mediated calcium release from skeletal muscle sarcoplasmic reticulum.|Muscle weakness, hepatotoxicity.\n> Skeletal muscle relaxants and opioid analgesics / Opioid agonists\nMorphine;Hydromorphone;Fentanyl;Oxycodone;Hydrocodone;Codeine;Meperidine|Activate μ-opioid receptors.|Respiratory depression, constipation, miosis, dependence. Meperidine metabolite can cause seizures.\n> Skeletal muscle relaxants and opioid analgesics / Atypical opioid analgesics\nTramadol|Weak μ agonism plus inhibition of serotonin and norepinephrine reuptake.|Seizures, serotonin syndrome, opioid effects.\n> Skeletal muscle relaxants and opioid analgesics / Mixed opioid agonists–antagonists\nButorphanol;Nalbuphine|Activate κ receptors and have antagonist or partial agonist activity at μ receptors.|Sedation, precipitated withdrawal.\n> Skeletal muscle relaxants and opioid analgesics / Topical TRPV1 agonists\nCapsaicin|Activates TRPV1 and desensitizes nociceptive terminals with repeated exposure.|Local burning.\n> Glaucoma therapy / Prostaglandin analogs\nLatanoprost;Travoprost;Bimatoprost|Increase uveoscleral aqueous humor outflow.|Iris darkening, eyelash growth, conjunctival hyperemia.\n> Glaucoma therapy / α₂ agonists\nBrimonidine;Apraclonidine|Activate α₂ receptors, decreasing aqueous humor production.|Dry mouth, ocular irritation.\n> Glaucoma therapy / Carbonic anhydrase inhibitors\nDorzolamide;Brinzolamide|Inhibit carbonic anhydrase, decreasing aqueous humor production.|Local irritation, bitter taste.\n# Psychiatry\n> CNS stimulants and antipsychotics / CNS stimulants\nMethylphenidate|Blocks norepinephrine and dopamine reuptake.|Insomnia, appetite suppression, increased blood pressure.\n> CNS stimulants and antipsychotics / Selective norepinephrine reuptake inhibitors\nAtomoxetine|Inhibits norepinephrine reuptake.|GI upset, somnolence, increased heart rate.\n> CNS stimulants and antipsychotics / First-generation antipsychotics\nChlorpromazine;Thioridazine;Fluphenazine;Haloperidol;Trifluoperazine|Block dopamine D₂ receptors.|Extrapyramidal effects, hyperprolactinemia, neuroleptic malignant syndrome, QT prolongation. Low-potency agents have more antimuscarinic and orthostatic effects.\n> CNS stimulants and antipsychotics / Second-generation antipsychotics\nClozapine;Olanzapine;Quetiapine;Risperidone;Paliperidone;Ziprasidone|Block serotonin 5-HT₂A and dopamine D₂ signaling to varying degrees.|Metabolic effects. Clozapine can cause severe neutropenia, myocarditis, and seizures. Risperidone can raise prolactin. Ziprasidone can prolong QT.\n> CNS stimulants and antipsychotics / Dopamine partial agonist antipsychotics\nAripiprazole;Brexpiprazole;Cariprazine|Partially activate dopamine D₂-family receptors and modulate serotonin signaling.|Akathisia.\n> CNS stimulants and antipsychotics / Muscarinic antipsychotics\nXanomeline–trospium|Xanomeline activates central M₁/M₄ signaling. Trospium blocks peripheral muscarinic effects.|Nausea, constipation, urinary retention.\n> CNS stimulants and antipsychotics / Mood stabilizers\nLithium|Modulates intracellular second messengers, including inositol signaling.|Tremor, hypothyroidism, nephrogenic diabetes insipidus, teratogenic risk.\n> CNS stimulants and antipsychotics / 5-HT₁A partial agonists\nBuspirone|Partially activates 5-HT₁A receptors.|Dizziness, nausea.\n> Antidepressants / SSRIs\nFluoxetine;Sertraline;Paroxetine;Citalopram;Escitalopram;Fluvoxamine|Selectively inhibit serotonin reuptake.|Sexual dysfunction, GI effects, serotonin syndrome, discontinuation symptoms. Citalopram can prolong QT.\n> Antidepressants / SNRIs\nVenlafaxine;Desvenlafaxine;Duloxetine|Inhibit serotonin and norepinephrine reuptake.|GI effects, sexual dysfunction, hypertension, discontinuation symptoms.\n> Antidepressants / Tricyclic antidepressants\nAmitriptyline;Nortriptyline;Imipramine;Desipramine;Clomipramine;Doxepin|Inhibit serotonin and norepinephrine reuptake and block several other receptors.|Antimuscarinic effects, sedation, orthostasis. Overdose can widen QRS and cause seizures.\n> Antidepressants / MAO inhibitors\nPhenelzine;Tranylcypromine;Isocarboxazid|Inhibit monoamine oxidase and increase monoamine levels.|Tyramine-related hypertensive crisis, serotonin syndrome.\n> Antidepressants / Atypical antidepressants\nBupropion|Inhibits norepinephrine and dopamine reuptake.|Insomnia, lowers seizure threshold.|Seizure disorder or current or prior bulimia or anorexia nervosa.\nMirtazapine|Blocks central α₂ receptors and selected serotonin receptors.|Sedation, increased appetite, weight gain.\nTrazodone|Blocks 5-HT₂ receptors and inhibits serotonin reuptake.|Sedation, orthostasis, priapism.\nVilazodone|Inhibits serotonin reuptake and partially activates 5-HT₁A receptors.|GI effects, serotonin syndrome.\nVortioxetine|Inhibits serotonin reuptake and modulates serotonin receptors.|Nausea, serotonin syndrome.\n> Substance use treatment / Alcohol use disorder medications\nAcamprosate|Modulates excitatory and inhibitory signaling during alcohol abstinence.|Diarrhea.|Severe renal impairment.\nDisulfiram|Inhibits aldehyde dehydrogenase, causing acetaldehyde accumulation after alcohol intake.|Flushing, nausea, hypotension with alcohol, hepatotoxicity.\n> Substance use treatment / Smoking cessation agents\nNicotine replacement|Provides nicotine through controlled delivery to reduce withdrawal.|Product-specific irritation, nausea.\nVarenicline|Partially activates α₄β₂ nicotinic receptors.|Nausea, vivid dreams.\n> Substance use treatment / Opioid agonists\nMethadone|Long-acting μ-opioid receptor agonist.|Respiratory depression, QT prolongation.\n> Substance use treatment / Partial opioid agonists\nBuprenorphine|High-affinity partial μ agonist.|Can precipitate withdrawal if started too soon after a full agonist.\n> Substance use treatment / Opioid antagonists\nNaloxone;Naltrexone|Antagonize opioid receptors. Naloxone reverses overdose. Naltrexone supports relapse prevention.|Precipitated withdrawal. Naltrexone carries hepatic warnings.\n> Substance use treatment / Peripheral opioid antagonists\nMethylnaltrexone|Peripherally antagonizes μ receptors to relieve opioid-induced constipation.|Abdominal pain, diarrhea.\n# Renal\n> Diuretics / Osmotic Diuretics\nMannitol|Osmotically retains water in renal tubules and draws water out of tissues.|Volume expansion, pulmonary edema, electrolyte changes.|Anuria or established severe pulmonary congestion.\n> Diuretics / Carbonic Anhydrase Inhibitors\nAcetazolamide|Inhibits proximal tubular carbonic anhydrase, increasing bicarbonate excretion.|Hyperchloremic metabolic acidosis, hypokalemia, calcium phosphate stones.\n> Diuretics / Loop Diuretics\nFurosemide;Bumetanide;Torsemide;Ethacrynic acid|Inhibit NKCC2 in the thick ascending limb.|Hypokalemic metabolic alkalosis, hypomagnesemia, ototoxicity. Ethacrynic acid lacks a sulfonamide group.\n> Diuretics / Thiazide Diuretics\nHydrochlorothiazide;Chlorthalidone;Indapamide;Metolazone|Inhibit the Na⁺/Cl⁻ cotransporter in the distal convoluted tubule.|Hyponatremia, hypokalemic metabolic alkalosis, hypercalcemia, hyperuricemia.\n> Diuretics / Potassium-Sparing Diuretics / Mineralocorticoid Receptor Antagonists\nSpironolactone;Eplerenone|Block the mineralocorticoid receptor in the collecting duct.|Hyperkalemia. Spironolactone can cause gynecomastia.\n> Diuretics / Potassium-Sparing Diuretics / ENaC Blockers\nAmiloride;Triamterene|Block ENaC in the collecting duct.|Hyperkalemia.\n> Renin–angiotensin system inhibitors / ACE inhibitors\nCaptopril;Enalapril;Lisinopril;Ramipril|Inhibit ACE, reducing angiotensin II and increasing bradykinin.|Cough, hyperkalemia, angioedema, acute creatinine rise.|Pregnancy, prior ACE inhibitor-related angioedema. Avoid in bilateral renal artery stenosis.\n> Renin–angiotensin system inhibitors / Angiotensin II receptor blockers\nLosartan;Valsartan;Candesartan;Irbesartan;Olmesartan|Block angiotensin II type 1 receptors.|Hyperkalemia, acute creatinine rise. Olmesartan can cause sprue-like enteropathy.|Pregnancy. Avoid in bilateral renal artery stenosis.\n> Renin–angiotensin system inhibitors / Direct renin inhibitors\nAliskiren|Directly inhibits renin.|Hyperkalemia, diarrhea, hypotension.|Pregnancy. Do not combine with an ACE inhibitor or ARB in diabetes.\n# Reproductive\n> Control of reproductive hormones / GnRH agonists\nLeuprolide;Goserelin;Nafarelin|Continuously stimulate GnRH receptors, then downregulate pituitary responsiveness after an initial flare.|Hot flashes, reduced bone density, transient tumor flare.\n> Control of reproductive hormones / GnRH antagonists\nDegarelix|Directly blocks GnRH receptors, rapidly suppressing LH and FSH.|Hot flashes, injection-site reactions.\n> Control of reproductive hormones / Estrogens\nEthinyl estradiol|Activates estrogen receptors. Combined hormonal contraception suppresses gonadotropins and ovulation.|Venous thromboembolism, hypertension.|Estrogen-containing contraception has contraindications including migraine with aura and certain thrombotic histories.\n> Control of reproductive hormones / Selective estrogen receptor modulators\nClomiphene|Blocks hypothalamic estrogen feedback, increasing gonadotropin release and inducing ovulation.|Hot flashes, visual symptoms, multiple gestation.\nTamoxifen|Antagonizes estrogen in breast and partially activates estrogen receptors in bone and endometrium.|Venous thromboembolism, endometrial cancer risk.\nRaloxifene|Agonist in bone and antagonist in breast and uterus.|Venous thromboembolism, hot flashes.\n> Control of reproductive hormones / Aromatase inhibitors\nAnastrozole;Letrozole;Exemestane|Inhibit aromatase and reduce estrogen synthesis.|Arthralgia, bone loss, hot flashes.\n> Control of reproductive hormones / Progestins\nMedroxyprogesterone;Levonorgestrel;Etonogestrel;Norethindrone|Activate progesterone receptors. Contraceptive effects include thickening cervical mucus and suppressing ovulation depending on formulation.|Irregular bleeding. Depot medroxyprogesterone can decrease bone density.\n> Control of reproductive hormones / Antiprogestins\nMifepristone|Blocks progesterone receptors and also antagonizes glucocorticoid receptors.|Bleeding, cramping.\n> Control of reproductive hormones / Selective progesterone receptor modulators\nUlipristal|Modulates progesterone receptors and delays ovulation.|Headache, menstrual timing changes.\n> Tocolytics and androgens / Tocolytics\nTerbutaline|Activates β₂ receptors and relaxes uterine smooth muscle.|Maternal tachycardia, hyperglycemia, hypokalemia.\nNifedipine|Blocks L-type calcium channels and reduces myometrial contraction.|Hypotension, headache.\nIndomethacin|Inhibits COX, decreasing prostaglandin-mediated uterine contractions.|Premature ductus arteriosus constriction and oligohydramnios risk.\n> Tocolytics and androgens / Androgens and androgen derivatives\nDanazol|Suppresses pituitary gonadotropins and has androgenic activity.|Acne, hirsutism, weight gain.|Pregnancy.\nTestosterone;Methyltestosterone|Activate androgen receptors.|Erythrocytosis, acne, suppression of spermatogenesis.\n> Tocolytics and androgens / Androgen synthesis inhibitors\nAbiraterone|Inhibits CYP17, decreasing androgen synthesis.|Hypertension, hypokalemia, fluid retention, hepatotoxicity.\n> Tocolytics and androgens / 5α-Reductase inhibitors\nFinasteride|Inhibits 5α-reductase, decreasing conversion of testosterone to DHT.|Sexual dysfunction.|Pregnancy exposure to crushed or broken tablets can harm male fetal development.\n> Tocolytics and androgens / Androgen receptor antagonists\nFlutamide;Bicalutamide|Block androgen receptors.|Gynecomastia, hepatotoxicity.\nSpironolactone|Blocks androgen receptors as well as mineralocorticoid receptors.|Hyperkalemia, gynecomastia, menstrual irregularities.\n> Tocolytics and androgens / Androgen synthesis inhibitors\nKetoconazole|Inhibits steroid synthesis at sufficient systemic exposure.|Hepatotoxicity, adrenal suppression, drug interactions.\n> Tocolytics and androgens / α₁A blockers\nTamsulosin|Preferentially blocks α₁A receptors, relaxing prostate and bladder-neck smooth muscle.|Orthostasis, ejaculatory dysfunction.\n> Tocolytics and androgens / Potassium channel openers\nMinoxidil|Opens ATP-sensitive potassium channels. Topical use promotes hair growth.|Topical irritation and hypertrichosis. Systemic use can cause const pharmacology = {text: 'Pharmacology', children: []};
const drugChapters = new Map();
let drugChapter, drugGroup;
for (const line of pharmacologyNotes.trim().split('\n')) {
  if (!line) continue;
  if (line.startsWith('# ')) {
    const chapterName = line.slice(2);
    if (!drugChapters.has(chapterName)) {
      drugChapters.set(chapterName, {text: chapterName === 'Pharmacology' ? 'General Pharmacology' : chapterName, children: []});
    }
    drugChapter = drugChapters.get(chapterName);
  } else if (line.startsWith('> ')) {
    drugGroup = drugChapter;
    for (const label of line.slice(2).split(' / ')) {
      let group = drugGroup.children.find(child => child.text === label && child.children);
      if (!group) {
        group = {text: label, children: []};
        drugGroup.children.push(group);
      }
      drugGroup = group;
    }
  } else {
    const [names, ...notes] = line.split('|');
    for (const name of names.split(';')) {
      let drug = drugGroup.children.find(child => child.drug && child.text === name);
      if (!drug) {
        drug = {text: name, drug: true, notes: ['', '', '']};
        drugGroup.children.push(drug);
      }
      for (const [i, note] of notes.entries()) {
        if (note.trim()) drug.notes[i] = [drug.notes[i], note.trim()].filter(Boolean).join(' ');
      }
    }
  }
}
for (const chapter of ['Immunology', 'Microbiology', 'Pharmacology', ...systems.keys()]) {
  const node = drugChapters.get(chapter);
  if (node && !pharmacology.children.includes(node)) pharmacology.children.push(node);
}
topics.push({id: 'pharmacology', label: pharmacology.text, node: pharmacology});

const svgNS = 'http://www.w3.org/2000/svg';
let x = 0;
let y = 0;
let pan = null;

function moveTo(left, top) {
  x = left;
  y = top;
  tree.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
}

function centerView() {
  const root = tree.firstElementChild.firstElementChild;
  moveTo((viewport.clientWidth - root.offsetWidth) / 2, (viewport.clientHeight - root.offsetHeight) / 2 - root.offsetTop);
}

viewport.addEventListener('pointerdown', event => {
  if (pan || !event.isPrimary || event.button !== 0 || event.target.closest('button, a')) return;
  pan = {pointerId: event.pointerId, clientX: event.clientX, clientY: event.clientY, x, y};
  viewport.setPointerCapture(event.pointerId);
  viewport.focus({preventScroll: true});
  event.preventDefault();
});

viewport.addEventListener('pointermove', event => {
  if (pan?.pointerId !== event.pointerId) return;
  const dx = event.clientX - pan.clientX;
  const dy = event.clientY - pan.clientY;
  if (dx || dy) viewport.classList.add('is-panning');
  moveTo(pan.x + dx, pan.y + dy);
});

function finishPan(event) {
  if (pan?.pointerId !== event.pointerId) return;
  pan = null;
  viewport.classList.remove('is-panning');
}

viewport.addEventListener('pointerup', finishPan);
viewport.addEventListener('pointercancel', finishPan);
viewport.addEventListener('lostpointercapture', finishPan);
viewport.addEventListener('wheel', event => {
  if (event.ctrlKey) return;
  const scale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
  const sideways = event.shiftKey && !event.deltaX;
  moveTo(x - (sideways ? event.deltaY : event.deltaX) * scale, y - (sideways ? 0 : event.deltaY) * scale);
  event.preventDefault();
}, {passive: false});

viewport.addEventListener('keydown', event => {
  const directions = {ArrowLeft: [55, 0], ArrowRight: [-55, 0], ArrowUp: [0, 55], ArrowDown: [0, -55]};
  if (event.target !== viewport || !directions[event.key]) return;
  const [dx, dy] = directions[event.key];
  moveTo(x + dx, y + dy);
  event.preventDefault();
});

viewport.addEventListener('focusin', event => {
  if (event.target === viewport || !event.target.matches(':focus-visible')) return;
  const frame = viewport.getBoundingClientRect();
  const button = event.target.getBoundingClientRect();
  const margin = 18;
  const dx = button.left < frame.left + margin ? frame.left + margin - button.left :
    button.right > frame.right - margin ? frame.right - margin - button.right : 0;
  const dy = button.top < frame.top + margin ? frame.top + margin - button.top :
    button.bottom > frame.bottom - margin ? frame.bottom - margin - button.bottom : 0;
  if (dx || dy) moveTo(x + dx, y + dy);
});

function updateConnectors() {
  for (const group of tree.querySelectorAll('.tree-children:not([hidden])')) {
    if (!group.offsetHeight) continue;
    const svg = group.firstElementChild;
    const middle = group.offsetHeight / 2;
    const width = svg.clientWidth;
    svg.replaceChildren();
    for (const child of [...group.children].slice(1)) {
      const box = child.firstElementChild;
      const end = child.offsetTop + box.offsetTop + box.offsetHeight / 2;
      const curve = document.createElementNS(svgNS, 'path');
      curve.setAttribute('d', 'M 12 ' + middle + ' C ' + width * .55 + ' ' + middle + ', ' + width * .48 + ' ' + end + ', ' + width + ' ' + end);
      svg.append(curve);
    }
  }
}
new ResizeObserver(updateConnectors).observe(viewport);

function openResult(entry){
 const [systemName,...headings]=entry.trail;
 let branch=entry.node;
 for(const text of headings.reverse())branch={text,children:[branch]};
 searchRoot={text:systemName,children:[branch]};
 let option=select.querySelector('option[value="search"]');
 if(!option){option=new Option('', 'search');select.add(option,1);}
 option.textContent=entry.node.text;
 select.value='search';
 browse.close();
 reset();
 let row=tree.firstElementChild;
 while(row){
   const button=row.querySelector('.tree-box > .tree-toggle');
   if(!button)break;
   button.click();
   row=row.querySelector('.tree-children > .tree-row');
 }
 const terminal=row?.querySelector('.tree-box');
 if(terminal){
   const frame=viewport.getBoundingClientRect();
   const box=terminal.getBoundingClientRect();
   moveTo(x+frame.left+(frame.width-box.width)/2-box.left,y+frame.top+(frame.height-box.height)/2-box.top);
 }
 viewport.focus({preventScroll:true});
}
function search(){
 const term=normalizeSearch(input.value.trim());
 results.replaceChildren();
 if(term.length<2){status.textContent='Enter at least two characters.';return;}
 const terms=term.split(/\s+/);
 const matches=index.filter(entry=>terms.every(word=>entry.key.includes(word)||entry.trail.some(text=>normalizeSearch(text).includes(word))));
 matches.sort((a,b)=>Number(!normalizeSearch(a.node.text).includes(term))-Number(!normalizeSearch(b.node.text).includes(term)));
 status.textContent=matches.length ? (matches.length>40?'Showing 40 of ':'')+matches.length+' matches' : 'No matching diagnosis, finding, or drug.';
 for(const entry of matches.slice(0,40)){
   const item=document.createElement('li');
   const button=document.createElement('button');
   const title=document.createElement('strong');title.textContent=entry.node.text;
   const small=document.createElement('small');small.textContent=entry.node.drug ? entry.trail.join(' · ') : entry.systemName+' · '+entry.node.detail;
   button.append(title,small);button.onclick=()=>openResult(entry);
   item.append(button);results.append(item);
 }
}
input.addEventListener('input',search);
controls.querySelector('#find-topic').onclick=()=>{search();browse.showModal();input.focus();};
