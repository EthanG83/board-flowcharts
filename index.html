/* Progressive disclosure is added when the chart controls are ready. */
.study .chart[hidden] { display: none; }
.study .index a[aria-current="true"] {
  color: var(--accent-dark);
  border-color: var(--accent);
  background: var(--tint);
}
.starting-label { margin-top: 18px; font-size: .87rem; font-weight: 750; color: var(--muted); }
.starting-label + .index { padding-top: 7px; }
.study .chart-heading h2 { flex: 1; }
.starting-link { font-size: .79rem; white-space: nowrap; }
.study .start { padding: 15px 17px; }
.study .start p { max-width: 510px; margin-inline: auto; }
.disclosure-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 34px;
  max-width: 100%;
  margin-top: 8px;
  padding: 4px 8px;
  border: 1px solid #a8cbc2;
  border-radius: 6px;
  background: #fff;
  color: var(--accent-dark);
  font: inherit;
  font-size: .78rem;
  font-weight: 720;
  line-height: 1.22;
  text-align: left;
  cursor: pointer;
}
.disclosure-toggle:hover { background: #d8eee7; border-color: var(--accent); }
.start .disclosure-toggle { margin-top: 10px; padding-inline: 10px; }
.disclosure-toggle svg { width: 15px; height: 15px; flex: none; transition: transform .28s ease; }
.disclosure-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.disclosure-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  visibility: hidden;
  transition: grid-template-rows .3s ease, opacity .22s ease, visibility 0s linear .3s;
}
.disclosure-panel[data-open] {
  grid-template-rows: 1fr;
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}
.disclosure-inner { min-height: 0; overflow: hidden; }
.study .result {
  display: block;
  position: relative;
  margin: 11px 0 1px;
  padding: 7px 9px;
  border: 1px solid #c9e4da;
  border-radius: 5px;
  background: var(--tint);
}
.study .result::before {
  content: "";
  position: absolute;
  height: 11px;
  left: 12px;
  bottom: 100%;
  border-left: 1px solid var(--line);
}
.study .result .arrow { display: none; }
.study .supplement { padding-top: 2px; }
.sources summary { cursor: pointer; color: var(--accent-dark); font-weight: 700; }
.sources summary:hover { text-decoration: underline; }
@media screen and (max-width: 650px) {
  .study .chart-heading { flex-wrap: wrap; column-gap: 8px; row-gap: 4px; }
  .starting-link { margin-left: auto; }
  .disclosure-toggle { min-height: 42px; }
}
@media (prefers-reduced-motion: reduce) {
  .disclosure-panel, .disclosure-toggle svg { transition: none; }
}
@media print {
  .study .chart[hidden] { display: block !important; }
  .disclosure-panel { display: block; visibility: visible; opacity: 1; }
  .disclosure-inner { overflow: visible; }
  .starting-label, .starting-link, .disclosure-toggle, .sources summary { display: none !important; }
  .study .result { margin: 6px 0 0; padding: 3px 5px; }
  .study .result::before { height: 6px; }
}



html { background: #030305; color-scheme: dark; }
body { background: #030305; color: #f0eeff; }
body.map-ready > .mast { display: none; }
main.wrap { width: 100%; }
.map-viewport {
  position: relative;
  height: calc(100dvh - 84px);
  min-height: 280px;
  overflow: clip;
  background: #030305;
  border-bottom: 1px solid #27243b;
  cursor: grab;
  touch-action: none;
}
.map-viewport:focus-visible { outline: 2px solid #64f6e7; outline-offset: -3px; }
.map-viewport.is-panning, .map-viewport.is-panning .tree-toggle { cursor: grabbing; }
.map-tree { position: absolute; inset: 0 auto auto 0; width: max-content; user-select: none; }
.tree-row {
  --neon: #bc9aff;
  --node-fill: #191125;
  display: flex;
  align-items: center;
  position: relative;
}
.depth-1 { --neon: #6dceff; --node-fill: #0b1a25; }
.depth-2 { --neon: #62f5c5; --node-fill: #0b211e; }
.depth-3 { --neon: #ff9cdb; --node-fill: #231326; }
.tree-box {
  position: relative;
  flex: none;
  width: clamp(205px, 27vw, 264px);
  padding: 14px 26px 14px 15px;
  border: 1px solid color-mix(in srgb, var(--neon) 62%, transparent);
  border-radius: 15px;
  background: var(--node-fill);
  color: #f8f6ff;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.4;
  box-shadow: 0 0 18px color-mix(in srgb, var(--neon) 16%, transparent);
}
.tree-box small { display: block; margin-top: 5px; color: #ccd2e4; font-size: 12px; font-weight: 400; }
.tree-toggle {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  padding: 0 0 2px;
  border-radius: 50%;
  border: 1px solid var(--neon);
  background: #090910;
  color: var(--neon);
  font: 700 22px/1 system-ui, sans-serif;
  cursor: pointer;
}
.tree-toggle:hover { background: var(--neon); color: #07070b; }
.tree-children {
  margin-left: 68px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  animation: grow .25s ease-out;
}
.tree-children[hidden] { display: none; }
.tree-connectors {
  position: absolute;
  right: 100%;
  top: 0;
  width: 68px;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  filter: drop-shadow(0 0 3px var(--neon));
}
.tree-connectors path {
  fill: none;
  stroke: var(--neon);
  stroke-width: 1.7px;
  stroke-linecap: round;
}
@keyframes grow { from { opacity: 0; } to { opacity: 1; } }
.map-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 14px 20px;
  background: #0c0b12;
  color: #ded9f4;
  font-size: .86rem;
}
.map-controls select, .map-controls button {
  font: inherit;
  min-height: 37px;
  max-width: 100%;
  padding: 7px 11px;
  border: 1px solid #423d5a;
  border-radius: 9px;
  color: #f2edff;
  background: #171323;
}
.map-controls button { cursor: pointer; }
.map-controls button:hover, .map-controls select:hover { border-color: #bc9aff; }
.map-hint { margin-left: auto; color: #b3adc8; }
body.map-ready .sources { margin: 0; padding: 12px 20px 22px; }
body.map-ready .sources a, body.map-ready .sources summary { color: #b6aaff; }
@media (prefers-reduced-motion: reduce) { .tree-children { animation: none; } }
@media (max-width: 620px) {
  .map-viewport { height: calc(100dvh - 138px); }
  .map-controls { padding: 10px 12px; }
  .map-hint { width: 100%; margin-left: 0; }
}
@media print {
  html, body { background: white; color: black; color-scheme: light; }
  .map-controls, .tree-toggle { display: none; }
  .map-viewport { height: auto; min-height: 0; overflow: visible; border: 0; background: white; }
  .map-tree { position: static; transform: none !important; zoom: .65; }
  .tree-box { color: #101020; background: #f5f2fc; box-shadow: none; }
  .tree-box small { color: #303447; }
  .tree-connectors { filter: none; }
  body.map-ready .sources a, body.map-ready .sources summary { color: #423663; }
}

html.map-fullscreen { overflow: hidden; }
main.map-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: 0;
  background: #030305;
}
main.map-fullscreen:fullscreen { height: 100%; }
main.map-fullscreen .map-viewport { height: 100%; min-height: 0; }
main.map-fullscreen .map-controls {
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}
main.map-fullscreen .sources, main.map-fullscreen .map-hint { display: none; }
@media print {
  main.map-fullscreen { position: static; display: block; height: auto; background: white; }
  main.map-fullscreen .map-viewport { height: auto; }
  main.map-fullscreen .sources { display: block; }
}


.atlas-dialog { width: min(680px, calc(100% - 24px)); max-height: 80dvh; padding: 18px; border: 1px solid #62538c; border-radius: 14px; background: #12101c; color: #f0eeff; }
.atlas-dialog::backdrop { background: rgb(0 0 0 / .72); }
.dialog-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px; }
.dialog-head h2 { font-size:1.25rem; }
.atlas-dialog button, .atlas-dialog input, .source-note-button { font:inherit; background:#221b34; color:#f2ecff; border:1px solid #5b4d77; border-radius:7px; padding:6px 9px; }
.atlas-dialog button, .source-note-button { cursor:pointer; }
.atlas-dialog input { display:block; width:100%; margin:6px 0 9px; }
.atlas-results { margin:8px 0 0; padding:0; list-style:none; }
.atlas-results button { width:100%; margin-bottom:6px; text-align:left; }
.atlas-results small { display:block; color:#bdb3db; }
.atlas-dialog a { color:#a7ecff; }
.atlas-status { margin:8px 0; color:#cec7df; font-size:.84rem; }
.atlas-note-text { white-space:pre-wrap; margin:12px 0; line-height:1.6; user-select:text; }
.source-note-button { display:block; margin-top:8px; padding:2px 6px; font-size:.72rem; }
@media print { .source-note-button, .atlas-dialog { display:none; } }


.tree-box .diagnostic-clue { margin: 0 0 6px; }
.diagnostic-result { color: var(--neon); }
@media print { .diagnostic-result { color:#101020; } }

.tree-box .numeric-cue {color:#fff; font-weight:750;}
@media print { .tree-box .numeric-cue {color:#101020;} }
</style>

n at lung apex or caseating granulomas, acid-fast bacilli | Pulmonary tuberculosis\nCD4 usually <200 cells/µL in HIV · diffuse ground-glass opacities | Pneumocystis pneumonia\nBird or bat exposure, small intracellular yeasts in macrophages | Histoplasmosis\nSouthwestern desert exposure, spherules containing endospores | Coccidioidomycosis\nBroad-based budding yeast, pulmonary and possible skin lesions | Blastomycosis\nNeutropenia, angioinvasion, septate acute-angle branching hyphae | Invasive aspergillosis\nKetoacidosis, necrotic sinonasal tissue, broad pauciseptate hyphae | Rhino-orbital mucormycosis\n> Diarrhea or abdominal infection → exposure, stool pattern and testing\nBloody diarrhea after undercooked beef, Shiga toxin, HUS risk | Shiga toxin–producing E. coli infection\nInflammatory diarrhea after poultry exposure, curved motile rods | Campylobacter enteritis\nBloody diarrhea with fever and tenesmus, low infectious dose | Shigellosis\nWatery diarrhea after antibiotics, stool toxin, possible pseudomembranes | Clostridioides difficile infection\nGreasy malabsorptive stool after untreated water exposure | Giardiasis\nBloody diarrhea or liver abscess, trophozoites with ingested RBCs | Amebiasis\nProfuse watery rice-water stools, curved oxidase-positive organism | Cholera\n> Fever with rash or systemic findings → exposure and targeted tests\nFever, cough, coryza, conjunctivitis, Koplik spots before rash | Measles\nMild rash, posterior auricular or suboccipital lymphadenopathy | Rubella\nSlapped-cheek rash, reticulocytopenia in aplastic crisis | Parvovirus B19 infection\n3–5 days of high fever, then truncal rash as fever resolves | Roseola\nSandpaper rash, strawberry tongue, group A streptococcal pharyngitis | Scarlet fever\nRash often 2–4 days after fever starts · may reach palms and soles, tick exposure | Rocky Mountain spotted fever\nExpanding erythema migrans, possible facial palsy or AV block | Lyme disease\nPainless chancre, or later palm and sole rash | Syphilis\nPosterior cervical lymphadenopathy, atypical lymphocytes, heterophile antibodies | EBV infectious mononucleosis\nMononucleosis-like illness with negative heterophile test | CMV mononucleosis\n> Meningitis, encephalitis or focal CNS lesions → CSF and imaging\nPetechiae or purpura with meningitis, gram-negative diplococci | Meningococcal disease\nNeonate, older adult or pregnancy, tumbling gram-positive rods | Listeriosis\nTemporal lobe abnormalities, encephalitis, positive HSV PCR | HSV encephalitis\nCD4 often <100 cells/µL in HIV · high CSF opening pressure, cryptococcal antigen | Cryptococcal meningitis\nCD4 often <100 cells/µL in HIV · multiple ring-enhancing brain lesions | Cerebral toxoplasmosis\n> Travel or parasite exposure → blood film and organ findings\nIntraerythrocytic ring forms and crescent-shaped gametocytes | Plasmodium falciparum malaria\nTick exposure, hemolysis, Maltese-cross tetrads | Babesiosis\nPeriorbital edema and myalgia after undercooked pork or wild game | Trichinellosis\nSeizures with cysts or calcified lesions in brain | Neurocysticercosis\nFreshwater exposure, terminal-spined ova in urine, hematuria | Schistosoma haematobium infection\nFreshwater exposure, lateral-spined ova and periportal fibrosis | Schistosoma mansoni infection\n# Hematology & Lymphatics\n> Childhood anemia or atypical infiltrates → marrow and tissue\nInfant with isolated red cell aplasia, macrocytosis, possible thumb anomalies | Diamond–Blackfan anemia\nPancytopenia with congenital anomalies and excess chromosomal breakage | Fanconi anemia\nCD1a and langerin-positive cells, grooved nuclei, Birbeck granules | Langerhans cell histiocytosis\nHTLV-1, hypercalcemia, flower cells | Adult T-cell leukemia/lymphoma\nCerebriform lymphocytes and cutaneous plaques, erythroderma in leukemic form | Cutaneous T-cell lymphoma\nClonal gastric B cells with lymphoepithelial lesions, chronic H. pylori gastritis | Gastric extranodal marginal zone lymphoma\n# Renal\n> Hematuria and proteinuria · Mixed glomerular pattern\nMesangial and endocapillary proliferation with GBM double contours | Membranoproliferative glomerulonephritis pattern\nRapid loss of filtration, crescents, necrosis, pauci-immune staining | ANCA-associated crescentic glomerulonephritis\n> Blood pressure, potassium and acid-base status → renal salt handling\nHypokalemic metabolic alkalosis, high urine calcium, normal or low BP | Bartter syndrome\nHypokalemic metabolic alkalosis, low urine calcium and low magnesium | Gitelman syndrome\nHypertension, hypokalemic alkalosis, low renin and low aldosterone | Liddle syndrome\n# Respiratory\n> Restrictive lung disease → exposure and radiographic pattern\nDry cough and dyspnea after thoracic radiation, changes within treated field | Radiation pneumonitis\nSmoker with upper-lobe nodules and irregular cysts | Pulmonary Langerhans cell histiocytosis\nSubacute dyspnea with peripheral or patchy consolidations, intra-alveolar fibroblastic plugs | Organizing pneumonia\n> Wheeze or stridor in children → sound and imaging\nBarking cough, inspiratory stridor, subglottic narrowing | Croup\nDrooling, tripod posture, thumbprint sign | Acute epiglottitis\nInfant with wheeze after viral upper respiratory symptoms, often RSV | Bronchiolitis\nPrematurity, diffuse reticulogranular opacities and air bronchograms | Neonatal respiratory distress syndrome\n# Gastrointestinal\n> Congenital GI obstruction → emesis, imaging and biopsy\nBilious emesis soon after birth, double-bubble sign and no distal gas | Duodenal atresia\nNo meconium by 48 hours in a term infant · transition zone, absent enteric ganglion cells | Hirschsprung disease\nIntermittent severe pain, target sign on ultrasound | Intussusception\nMidgut twisting with bilious emesis and mesenteric whirlpool sign | Midgut volvulus\n> Colorectal polyposis or characteristic tumor → genetics and histology\nHundreds of colorectal adenomas, germline APC variant | Familial adenomatous polyposis\nEarly colorectal or endometrial cancer, mismatch-repair deficiency | Lynch syndrome\nHamartomatous polyps and mucocutaneous pigmentation, STK11 | Peutz–Jeghers syndrome\nGastric signet-ring cells with diffuse thickening and rigidity | Diffuse gastric adenocarcinoma\n# Endocrine\n> Endocrine tumor combinations → affected glands\nParathyroid, pituitary and pancreatic neuroendocrine tumors | MEN type 1\nMedullary thyroid carcinoma, pheochromocytoma and hyperparathyroidism | MEN type 2A\nMedullary thyroid carcinoma, pheochromocytoma, mucosal neuromas | MEN type 2B\n# Neurology & Special Senses\n> Pediatric neurologic or neurocutaneous findings → phenotype and imaging\nFacial port-wine stain and leptomeningeal vascular malformation | Sturge–Weber syndrome\n≥6 café-au-lait macules >5 mm before puberty or >15 mm after · look for a second NF1 criterion | Neurofibromatosis type 1\nBilateral vestibular schwannomas | NF2-related schwannomatosis\nCortical tubers, seizures, facial angiofibromas and renal angiomyolipomas | Tuberous sclerosis complex\nRetinal or CNS hemangioblastomas, clear cell renal carcinoma | Von Hippel–Lindau disease\nLoss of acquired language and hand skills, repetitive hand movements, MECP2 | Rett syndrome\nTypical onset age 10–15 years · ataxia, areflexia, hypertrophic cardiomyopathy, FXN GAA expansion | Friedreich ataxia\n# Cardiovascular\n> ECG rhythm → rate, regularity and atrioventricular conduction\nIrregularly irregular rhythm without discrete P waves | Atrial fibrillation\nAtrial rate often ~300/min, ventricular rate ~150/min with 2:1 conduction · sawtooth waves | Atrial flutter\nAbrupt regular narrow-complex tachycardia, P waves often hidden | AV nodal reentrant tachycardia\nPR <120 ms · delta wave, widened QRS | Wolff–Parkinson–White pattern\nProgressively longer PR until a QRS drops | Mobitz I AV block\nFixed PR intervals with intermittent nonconducted P waves | Mobitz II AV block\nIndependent atrial and ventricular rates | Complete heart block\nPolymorphic ventricular tachycardia twisting around baseline with prolonged QT | Torsades de pointes";

const systems=new Map();
let system,group,parent;
for(const line of raw.trim().split('\n')){
 if(line.startsWith('# ')){
   const name=line.slice(2);
   if(!systems.has(name))systems.set(name,{text:name,children:[]});
   system=systems.get(name);
 } else if(line.startsWith('>> ')){
   parent={text:line.slice(3),children:[]};group.children.push(parent);
 } else if(line.startsWith('> ')){
   group={text:line.slice(2),children:[]};system.children.push(group);parent=group;
 } else if(line.includes(' | ')){
   const [clue,diagnosis]=line.split(' | ');
   parent.children.push({text:diagnosis,detail:clue,diagnosis:true});
 } else throw Error('Malformed branch '+line);
}
const rootOrder=['Hematology & Lymphatics','Cardiovascular','Respiratory','Renal','Gastrointestinal','Endocrine','Reproductive','Musculoskeletal, Skin & Connective Tissue','Neurology & Special Senses','Psychiatry','Infectious Diseases','Immune & Multisystem Disorders'];
const topics=rootOrder.map((label,i)=>({id:'system-'+i,label,node:systems.get(label)}));
const all={text:'First Aid · Pathology Differentials',children:topics.map(item=>item.node)};
let searchRoot=null;
const index=[];
const normalizeSearch=text=>text.normalize('NFKD').replace(/\p{Diacritic}/gu,'').toLowerCase();
function addToIndex(node,systemName,trail){
 if(node.diagnosis)index.push({node,trail,systemName,key:normalizeSearch(node.text+' '+node.detail)});
 else for(const child of node.children)addToIndex(child,systemName,[...trail,node.text]);
}
for(const item of topics)addToIndex(item.node,item.label,[]);

const main=document.querySelector('main');
main.replaceChildren();
const controls=document.createElement('div');
controls.className='map-controls';
controls.innerHTML='<label for="start-select">Starting point</label> <select id="start-select"><option value="all">All organ systems</option></select><button id="find-topic" type="button">Find diagnosis</button><button id="reset-map">Collapse all</button><button id="center-map">Center view</button><button id="fullscreen-map" type="button">Full screen</button><button id="print-map">Print</button><span class="map-hint">Drag to move · Select an arrow to expand</span>';
const select=controls.querySelector('select');
topics.forEach(t=>{const o=document.createElement('option');o.value=t.id;o.textContent=t.label;select.append(o);});
const viewport=document.createElement('div');viewport.className='map-viewport';viewport.tabIndex=0;viewport.setAttribute('aria-label','Expandable flowchart. Drag to pan in any direction, or use the arrow keys.');


const tree = document.createElement('div');
tree.className = 'map-tree';
viewport.append(tree);
const svgNS = 'http://www.w3.org/2000/svg';
let x = 0;
let y = 0;
let pan = null;

function moveTo(left, top) {
  x = left;
  y = top;
  tree.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
}

function centerView() {
  const root = tree.firstElementChild.firstElementChild;
  moveTo((viewport.clientWidth - root.offsetWidth) / 2, (viewport.clientHeight - root.offsetHeight) / 2 - root.offsetTop);
}

viewport.addEventListener('pointerdown', event => {
  if (pan || !event.isPrimary || event.button !== 0 || event.target.closest('button, a')) return;
  pan = {pointerId: event.pointerId, clientX: event.clientX, clientY: event.clientY, x, y};
  viewport.setPointerCapture(event.pointerId);
  viewport.focus({preventScroll: true});
  event.preventDefault();
});

viewport.addEventListener('pointermove', event => {
  if (pan?.pointerId !== event.pointerId) return;
  const dx = event.clientX - pan.clientX;
  const dy = event.clientY - pan.clientY;
  if (dx || dy) viewport.classList.add('is-panning');
  moveTo(pan.x + dx, pan.y + dy);
});

function finishPan(event) {
  if (pan?.pointerId !== event.pointerId) return;
  pan = null;
  viewport.classList.remove('is-panning');
}

viewport.addEventListener('pointerup', finishPan);
viewport.addEventListener('pointercancel', finishPan);
viewport.addEventListener('lostpointercapture', finishPan);
viewport.addEventListener('wheel', event => {
  if (event.ctrlKey) return;
  const scale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
  const sideways = event.shiftKey && !event.deltaX;
  moveTo(x - (sideways ? event.deltaY : event.deltaX) * scale, y - (sideways ? 0 : event.deltaY) * scale);
  event.preventDefault();
}, {passive: false});

viewport.addEventListener('keydown', event => {
  const directions = {ArrowLeft: [55, 0], ArrowRight: [-55, 0], ArrowUp: [0, 55], ArrowDown: [0, -55]};
  if (event.target !== viewport || !directions[event.key]) return;
  const [dx, dy] = directions[event.key];
  moveTo(x + dx, y + dy);
  event.preventDefault();
});

viewport.addEventListener('focusin', event => {
  if (event.target === viewport || !event.target.matches(':focus-visible')) return;
  const frame = viewport.getBoundingClientRect();
  const button = event.target.getBoundingClientRect();
  const margin = 18;
  const dx = button.left < frame.left + margin ? frame.left + margin - button.left :
    button.right > frame.right - margin ? frame.right - margin - button.right : 0;
  const dy = button.top < frame.top + margin ? frame.top + margin - button.top :
    button.bottom > frame.bottom - margin ? frame.bottom - margin - button.bottom : 0;
  if (dx || dy) moveTo(x + dx, y + dy);
});

function updateConnectors() {
  for (const group of tree.querySelectorAll('.tree-children:not([hidden])')) {
    if (!group.offsetHeight) continue;
    const svg = group.firstElementChild;
    const middle = group.offsetHeight / 2;
    const width = svg.clientWidth;
    svg.replaceChildren();
    for (const child of [...group.children].slice(1)) {
      const box = child.firstElementChild;
      const end = child.offsetTop + box.offsetTop + box.offsetHeight / 2;
      const curve = document.createElementNS(svgNS, 'path');
      curve.setAttribute('d', 'M 12 ' + middle + ' C ' + width * .55 + ' ' + middle + ', ' + width * .48 + ' ' + end + ', ' + width + ' ' + end);
      svg.append(curve);
    }
  }
}
new ResizeObserver(updateConnectors).observe(viewport);

main.append(viewport,controls);

const browse=document.createElement('dialog');
browse.className='atlas-dialog';
browse.innerHTML='<form method="dialog" class="dialog-head"><h2>Find a diagnosis or clue</h2><button aria-label="Close search">Close</button></form><label for="atlas-search">Search diagnosis or finding</label><input id="atlas-search" type="search" placeholder="Try macrocytic, schistocytes, or Graves"><p class="atlas-status" role="status"></p><ol class="atlas-results"></ol>';
main.append(browse);
const input=browse.querySelector('input');
const results=browse.querySelector('.atlas-results');
const status=browse.querySelector('.atlas-status');

function openResult(entry){
 const [systemName,...headings]=entry.trail;
 let branch=entry.node;
 for(const text of headings.reverse())branch={text,children:[branch]};
 searchRoot={text:systemName,children:[branch]};
 let option=select.querySelector('option[value="search"]');
 if(!option){option=new Option('', 'search');select.add(option,1);}
 option.textContent=entry.node.text;
 select.value='search';
 browse.close();
 reset();
 let row=tree.firstElementChild;
 while(row){
   const button=row.querySelector('.tree-box > .tree-toggle');
   if(!button)break;
   button.click();
   row=row.querySelector('.tree-children > .tree-row');
 }
 const terminal=row?.querySelector('.tree-box');
 if(terminal){
   const frame=viewport.getBoundingClientRect();
   const box=terminal.getBoundingClientRect();
   moveTo(x+frame.left+(frame.width-box.width)/2-box.left,y+frame.top+(frame.height-box.height)/2-box.top);
 }
 viewport.focus({preventScroll:true});
}
function search(){
 const term=normalizeSearch(input.value.trim());
 results.replaceChildren();
 if(term.length<2){status.textContent='Enter at least two characters.';return;}
 const terms=term.split(/\s+/);
 const matches=index.filter(entry=>terms.every(word=>entry.key.includes(word)||entry.trail.some(text=>normalizeSearch(text).includes(word))));
 matches.sort((a,b)=>Number(!normalizeSearch(a.node.text).includes(term))-Number(!normalizeSearch(b.node.text).includes(term)));
 status.textContent=matches.length ? (matches.length>40?'Showing 40 of ':'')+matches.length+' matches' : 'No matching diagnosis or finding.';
 for(const entry of matches.slice(0,40)){
   const item=document.createElement('li');
   const button=document.createElement('button');
   const title=document.createElement('strong');title.textContent=entry.node.text;
   const small=document.createElement('small');small.textContent=entry.systemName+' · '+entry.node.detail;
   button.append(title,small);button.onclick=()=>openResult(entry);
   item.append(button);results.append(item);
 }
}
input.addEventListener('input',search);
controls.querySelector('#find-topic').onclick=()=>{search();browse.showModal();input.focus();};

let seq=0;
function renderNode(data,depth=0){
 const row=document.createElement('div');row.className='tree-row depth-'+Math.min(depth,3);
 const box=document.createElement('div');box.className='tree-box';
 const text=document.createElement('div');text.textContent=data.text;
 if(data.diagnosis){
   const clue=document.createElement('small');clue.className='diagnostic-clue';clue.textContent=data.detail;
   const [lead,...rest]=data.detail.split(' · ');
   if(rest.length && /[0-9]/.test(lead)){
     const value=document.createElement('strong');value.className='numeric-cue';value.textContent=lead;
     clue.replaceChildren(value,document.createTextNode(' · '+rest.join(' · ')));
   }
   text.className='diagnostic-result';
   box.append(clue,text);
 }else{box.append(text);}
 row.append(box);
 if(data.children?.length){
  const button=document.createElement('button');button.className='tree-toggle';button.textContent='›';button.setAttribute('aria-label','Expand '+data.text);button.setAttribute('aria-expanded','false');
  const group=document.createElement('div');group.className='tree-children';group.id='tree-group-'+(++seq);group.hidden=true;
  button.setAttribute('aria-controls',group.id);
  box.append(button);row.append(group);
  button.onclick=()=>{
   const open=group.hidden;
   const top = box.getBoundingClientRect().top;
   if (open && !group.childElementCount) {
     const svg = document.createElementNS(svgNS, 'svg');
     svg.setAttribute('class', 'tree-connectors');
     svg.setAttribute('aria-hidden', 'true');
     group.append(svg, ...data.children.map(child => renderNode(child, depth + 1)));
   }
   group.hidden=!open;button.textContent=open?'‹':'›';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',(open?'Collapse ':'Expand ')+data.text);
   moveTo(x, y + top - box.getBoundingClientRect().top);
   updateConnectors();
  };
 }
 return row;
}
function reset() {
  const topic = select.value === 'all' ? all : select.value === 'search' ? searchRoot : topics.find(item => item.id === select.value).node;
  tree.replaceChildren(renderNode(topic));
  centerView();
}
select.onchange = reset;
controls.querySelector('#reset-map').onclick = reset;
controls.querySelector('#center-map').onclick = centerView;
controls.querySelector('#print-map').onclick = () => window.print();

const fullscreenButton = controls.querySelector('#fullscreen-map');
let expandedInBrowser = false;

function syncFullscreen() {
  const expanded = expandedInBrowser || document.fullscreenElement === main;
  main.classList.toggle('map-fullscreen', expanded);
  document.documentElement.classList.toggle('map-fullscreen', expanded);
  fullscreenButton.textContent = expanded ? 'Exit full screen' : 'Full screen';
}

fullscreenButton.addEventListener('click', async () => {
  if (document.fullscreenElement === main) {
    await document.exitFullscreen();
    return;
  }
  if (expandedInBrowser) {
    expandedInBrowser = false;
    syncFullscreen();
    return;
  }
  if (document.fullscreenEnabled && main.requestFullscreen) {
    try {
      await main.requestFullscreen();
      return;
    } catch {
      // A browser or embedded preview can block native fullscreen.
    }
  }
  expandedInBrowser = true;
  syncFullscreen();
});
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !expandedInBrowser) return;
  expandedInBrowser = false;
  syncFullscreen();
  fullscreenButton.focus({preventScroll: true});
});

document.body.classList.add('map-ready');
reset();
</script>
</body>
</html>
