ygen delivery","Severe anemia and hypoxia can cause hydrops"]],"Sideroblastic anemia":[["Iron, ferritin and transferrin saturation often ↑","Bone marrow iron stain shows ring sideroblasts","MCV varies by cause, a dimorphic population may occur"],["A defect in heme synthesis or mitochondrial iron handling traps iron in erythroblasts","Iron accumulates around nuclei","Red-cell production becomes ineffective"]],"Lead poisoning":[["Venous blood lead level ↑","Zinc protoporphyrin may rise with sustained exposure","Microcytosis and basophilic stippling can occur"],["Lead inhibits ALA dehydratase and ferrochelatase","Heme synthesis falls","Lead also impairs RBC RNA breakdown","Microcytosis and stippling can develop"]],"Anemia of chronic kidney disease":[["Hemoglobin ↓, usually normal MCV","Reticulocyte response low","Creatinine ↑ or eGFR ↓, assess ferritin and transferrin saturation for coexisting iron deficiency"],["Kidney damage reduces erythropoietin output","Marrow receives less erythropoietic stimulation","Uremia and inflammation can further suppress RBC production"]],"Aplastic anemia":[["CBC shows cytopenias across cell lines","Absolute reticulocyte count ↓","Bone marrow hypocellular with fatty replacement"],["Hematopoietic stem cells are lost or suppressed","Marrow cellularity falls","RBC, white cell and platelet production fall together"]],"Pure red cell aplasia":[["Severe anemia with very low reticulocytes","White cells and platelets generally preserved","Marrow has markedly reduced erythroid precursors"],["Erythroid precursors are selectively injured or inhibited","Marrow cannot make new RBCs","Isolated anemia develops"]],"Vitamin B₁₂ deficiency":[["Serum B₁₂ ↓ or borderline","Methylmalonic acid ↑ and homocysteine ↑","MCV often >100 fL, macro-ovalocytes and hypersegmented neutrophils","Reticulocytes ↓, LDH may ↑"],["B₁₂ deficiency traps folate in a form unavailable for DNA synthesis","Cell division slows in marrow precursors","Megaloblasts and macrocytosis develop","Impaired myelin maintenance can cause neurologic findings"]],"Folate deficiency":[["Serum folate ↓","Homocysteine ↑, methylmalonic acid usually normal","MCV often >100 fL, macro-ovalocytes and hypersegmented neutrophils"],["Low folate limits thymidylate synthesis","DNA synthesis slows","Marrow precursors mature abnormally","Megaloblastic anemia develops"]],"Pernicious anemia":[["B₁₂ ↓, methylmalonic acid ↑, homocysteine ↑","Intrinsic factor antibodies support diagnosis when positive","CBC may show macrocytic anemia"],["Autoimmune gastritis damages parietal cells and reduces intrinsic factor","Terminal ileum absorbs less B₁₂","Depleted B₁₂ causes megaloblastosis and may damage myelin"]],"Hereditary spherocytosis":[["Spherocytes on smear, DAT negative","MCHC often ↑, eosin-5-maleimide binding ↓","Reticulocytes and indirect bilirubin ↑ with hemolysis"],["Membrane skeleton proteins are defective","RBCs lose membrane surface and become spherical","Less deformable RBCs are trapped in the spleen","Extravascular hemolysis follows"]],"Warm autoimmune hemolytic anemia":[["DAT positive for IgG with or without C3","Spherocytes, reticulocytes ↑","LDH and indirect bilirubin ↑, haptoglobin often ↓"],["Warm-reactive IgG coats RBCs","Splenic macrophages remove membrane or whole cells","Spherocytes form and RBC survival falls"]],"Cold agglutinin disease":[["DAT usually C3 positive and IgG negative","Cold agglutinin titer ↑, RBC agglutination","Hemolysis markers include indirect bilirubin and LDH ↑"],["IgM binds RBCs in cooler vessels","Complement is activated","IgM can detach on warming while C3 fragments remain","Opsonized cells are cleared mainly in the liver"]],"G6PD deficiency":[["G6PD activity ↓, may appear normal during acute hemolysis so repeat when recovered","Bite cells or blister cells, Heinz bodies on supravital stain","LDH and indirect bilirubin ↑, haptoglobin ↓"],["Low G6PD reduces NADPH production","Reduced glutathione cannot be regenerated adequately","Oxidants damage hemoglobin and membrane","RBCs hemolyze or lose Heinz bodies in the spleen"]],"Pyruvate kinase deficiency":[["RBC pyruvate kinase activity ↓ or pathogenic PKLR variants","Reticulocytes and indirect bilirubin ↑","Echinocytes can occur"],["Deficient glycolytic enzyme reduces RBC ATP","Membrane pumps and deformability deteriorate","Spleen removes damaged RBCs","Chronic extravascular hemolysis develops"]],"Sickle cell anemia (HbSS)":[["HbS predominates with no HbA if untreated and untransfused","HbF varies, reticulocytes usually ↑","Smear may show sickled cells and target cells, indirect bilirubin ↑"],["HBB variant replaces glutamate with valine","Deoxygenated HbS polymerizes","RBCs become rigid and sickle","Hemolysis and microvascular obstruction follow"]],"Hemoglobin C disease":[["HbC predominates with no HbA if untransfused","Target cells and sometimes HbC crystals","Mild anemia, reticulocytes and indirect bilirubin may ↑"],["HBB variant replaces glutamate with lysine","HbC can crystallize and RBCs dehydrate","Rigid RBCs are cleared by the spleen"]],"Paroxysmal nocturnal hemoglobinuria":[["Flow cytometry shows GPI-deficient granulocytes or monocytes and loss of RBC CD59","LDH ↑, haptoglobin ↓, urine hemoglobin may be positive","Cytopenias may coexist"],["Acquired PIGA mutation arises in a stem cell","GPI anchors and complement regulators are lost","Complement lyses RBCs and promotes thrombosis"]],"von Willebrand disease":[["VWF antigen and platelet-dependent VWF activity ↓ or discordant by subtype","Factor VIII may ↓, PT usually normal and aPTT may be normal","Type 1: VWF <0.30 IU/mL, or <0.50 with abnormal bleeding"],["VWF quantity or function is impaired","Platelet adhesion falls and factor VIII is less well stabilized","Mucosal bleeding becomes more likely"]],"Hemophilia A":[["Factor VIII activity ↓, severe <1%","PT normal, aPTT often prolonged and corrects on mixing without inhibitor","Platelets usually normal"],["Low factor VIII impairs intrinsic tenase","Less factor X is activated","Thrombin and fibrin generation fall","Deep bleeding and hemarthroses result"]],"Hemophilia B":[["Factor IX activity ↓, severe <1%","PT normal, aPTT often prolonged and corrects on mixing without inhibitor","Platelets usually normal"],["Low factor IX impairs intrinsic tenase","Less factor X is activated","Thrombin and fibrin generation fall","Deep bleeding and hemarthroses result"]],"Immune thrombocytopenia":[["Isolated platelet count <100 × 10⁹/L","PT and aPTT usually normal","Smear may show large platelets, without schistocytes"],["Autoantibodies and T-cell responses target platelets and megakaryocytes","Platelet clearance rises and production can fall","Mucocutaneous bleeding can result"]],"Thrombotic thrombocytopenic purpura":[["ADAMTS13 activity <10%","Platelets ↓, schistocytes, LDH ↑ and haptoglobin ↓","PT and aPTT usually normal"],["Severe ADAMTS13 deficiency leaves large VWF multimers intact","Platelet-rich microthrombi form","Platelets are consumed and RBCs shear","Organ ischemia can develop"]],"Shiga toxin–associated hemolytic uremic syndrome":[["Platelets ↓, schistocytes, LDH ↑, haptoglobin ↓","Creatinine ↑, urinalysis may show hematuria and proteinuria","Stool testing can detect Shiga toxin or the producing organism"],["Enteric Shiga toxin injures endothelium","Renal microvascular thrombosis develops","RBCs fragment and platelets are consumed","Acute kidney injury follows"]],"Acute disseminated intravascular coagulation":[["Platelets ↓, D-dimer ↑, fibrinogen often ↓ or falling","PT and aPTT often prolonged","Schistocytes can occur"],["Sepsis, trauma or another trigger activates coagulation widely","Microthrombi consume platelets and factors","Fibrin breakdown increases","Bleeding and ischemia may coexist"]],"Heparin-induced thrombocytopenia":[["Platelet fall typically >50% from baseline","PF4/heparin immunoassay detects antibodies","A functional assay can confirm platelet activation"],["Heparin binds platelet factor 4","IgG forms against the complex","Antibody complexes activate platelets","Thrombosis and platelet consumption follow"]],"HELLP syndrome":[["LDH and indirect bilirubin ↑, haptoglobin ↓, possible schistocytes","AST and ALT ↑","Platelets ↓"],["Placental and maternal endothelial dysfunction activates coagulation","Microvascular injury fragments RBCs and consumes platelets","Hepatic microvascular injury raises liver enzymes"]],"Polycythemia vera":[["Hemoglobin >16.5 g/dL in men or >16.0 in women raises suspicion","Erythropoietin often ↓, JAK2 V617F or exon 12 mutation","Platelets and WBC may also ↑","PaO₂ and SaO₂ often normal"],["JAK2 signaling stays active without normal growth-factor control","Marrow expands erythroid production","Hemoglobin and oxygen content rise at the same saturation","Hyperviscosity and thrombosis risk increase"]],"Essential thrombocythemia":[["Persistent platelets ≥450 × 10⁹/L","JAK2, CALR or MPL variant often detected","Marrow shows clonal megakaryocytic proliferation"],["A clonal driver activates growth signaling","Megakaryocytes expand","Platelet count rises","Abnormal platelets promote thrombosis or bleeding"]],"Primary myelofibrosis":[["Teardrop RBCs and leukoerythroblastosis","LDH often ↑, cytopenias vary","Marrow reticulin or collagen fibrosis, JAK2/CALR/MPL may be detected"],["Clonal megakaryocytes release fibrogenic cytokines","Marrow stroma scars","Blood formation shifts to spleen and liver","Splenomegaly and abnormal circulating cells develop"]],"Acute myeloid leukemia":[["Blood or marrow blasts ≥20% for AML without defining genetics","Myeloperoxidase supports myeloid lineage","Anemia, thrombocytopenia or neutropenia commonly occur"],["Acquired mutations block myeloid maturation and favor clonal growth","Blasts accumulate","Normal marrow production is crowded out"]],"Acute promyelocytic leukemia":[["PML::RARA fusion, usually t(15","17)","Abnormal promyelocytes with abundant granules or Auer rods","Platelets and fibrinogen may ↓, D-dimer ↑ with DIC"],["PML::RARA disrupts transcription needed for maturation","Promyelocytes accumulate","Procoagulant and fibrinolytic activity promotes DIC"]],"Chronic lymphocytic leukemia":[["Clonal B cells ≥5 × 10⁹/L for ≥3 months in typical blood-defined CLL","CD5 and CD23 coexpression, smudge cells may be seen","Hypogammaglobulinemia or autoimmune hemolysis can occur"],["Clonal mature B cells evade normal cell death","Cells accumulate in blood, marrow and nodes","Normal immune function and sometimes marrow production decline"]],"Chronic myeloid leukemia":[["BCR::ABL1 by PCR, FISH or cytogenetics","Leukocytosis with granulocytic left shift and basophilia","Platelets may ↑"],["t(9;22) creates BCR::ABL1","Constitutive tyrosine kinase signaling drives myeloid growth","Mature and immature granulocytes accumulate"]],"Multiple myeloma":[["Serum or urine monoclonal protein by electrophoresis and immunofixation, abnormal free light chain ratio","Clonal marrow plasma cells ≥10% or plasmacytoma plus a defining event","Calcium or creatinine may ↑, hemoglobin may ↓"],["A plasma cell clone expands and secretes monoclonal protein","Marrow replacement reduces normal blood production","Bone resorption and light-chain injury can cause hypercalcemia and renal disease"]],"Poststreptococcal glomerulonephritis":[["C3 ↓, often normalizes in 6–8 weeks","ASO or anti-DNase B supports recent streptococcal infection","Dysmorphic RBCs, RBC casts and proteinuria, creatinine may ↑"],["Nephritogenic infection provokes immune complex deposition","Complement activates in glomeruli","Inflamed capillaries leak blood and filtration falls"]],"IgA nephropathy":[["Urinalysis shows hematuria with variable proteinuria","Serum complement usually normal","Biopsy shows dominant mesangial IgA"],["Galactose-deficient IgA1 forms immune complexes","Complexes deposit in mesangium","Inflammation causes glomerular bleeding"]],"Anti-GBM disease":[["Anti-GBM antibodies in serum","Hematuria and RBC casts, creatinine ↑","Biopsy shows linear IgG along GBM"],["Autoantibodies bind type IV collagen in basement membranes","Glomerular capillaries inflame and form crescents","Pulmonary basement membrane involvement can cause alveolar hemorrhage"]],"Alport syndrome":[["Persistent glomerular hematuria, later proteinuria and falling eGFR","COL4A3/COL4A4/COL4A5 variants may confirm diagnosis"],["Type IV collagen network is abnormal","Basement membranes in kidney, cochlea and eye become defective","Hematuria progresses to renal scarring and hearing loss"]],"Lupus nephritis":[["Proteinuria and active urine sediment, possible creatinine ↑","Anti-dsDNA often ↑, C3 and C4 often ↓","Biopsy may show full-house immunofluorescence"],["Nuclear antigens form immune complexes with autoantibodies","Complexes deposit in glomeruli","Complement activation causes inflammation and protein or RBC leakage"]],"Minimal change disease":[["Heavy urine protein, albumin ↓, lipids often ↑","Light microscopy usually normal, electron microscopy shows diffuse foot-process effacement"],["Podocyte function is disrupted","Foot processes efface and the filtration barrier leaks albumin","Hypoalbuminemia and edema develop"]],"Focal segmental glomerulosclerosis":[["Proteinuria, sometimes nephrotic-range, serum albumin may ↓","Biopsy shows segmental sclerosis in some glomeruli"],["Podocyte injury or loss exposes capillary basement membrane","Segments scar in some glomeruli","Protein leaks and kidney function can decline"]],"Membranous nephropathy":[["Heavy proteinuria, albumin ↓","Anti-PLA2R often positive in primary disease","Biopsy shows subepithelial deposits"],["Antibodies bind podocyte antigens or other targets","Subepithelial immune deposits activate complement","Podocyte injury produces proteinuria"]],"Diabetic nephropathy":[["Urine albumin-to-creatinine ratio ≥30 mg/g can indicate albuminuria if persistent","eGFR may initially rise then fall","HbA₁c reflects glycemic exposure, not renal diagnosis alone"],["Chronic hyperglycemia alters glomerular hemodynamics and matrix production","Mesangial expansion and basement membrane thickening develop","Albumin leaks and filtration declines"]],"Distal (type 1) renal tubular acidosis":[["Hyperchloremic normal-anion-gap metabolic acidosis","Urine pH >5.5 despite systemic acidosis, potassium often ↓","Hypocitraturia and calcium phosphate stones may occur"],["Distal α-intercalated cells cannot secrete enough hydrogen ions","Urine remains too alkaline during systemic acidosis","Acid retention and stone risk rise"]],"Proximal (type 2) renal tubular acidosis":[["Hyperchloremic normal-anion-gap metabolic acidosis, potassium often ↓","Urine pH can fall <5.5 after plasma bicarbonate falls below its reduced reabsorption threshold","Bicarbonate wasting when filtered load exceeds threshold"],["Proximal bicarbonate reabsorption falls","Excess filtered bicarbonate is lost","At the new low bicarbonate level, intact distal acidification can lower urine pH"]],"Type 4 renal tubular acidosis":[["Hyperkalemia with hyperchloremic normal-anion-gap metabolic acidosis","Urine pH often <5.5, urinary ammonium excretion reduced","Renin and aldosterone depend on the cause"],["Aldosterone activity falls or tubules resist it","Potassium secretion falls","Hyperkalemia suppresses ammonium production","Net acid excretion declines"]],"Fanconi syndrome":[["Glucosuria despite normal serum glucose","Phosphaturia with hypophosphatemia, bicarbonate wasting, aminoaciduria","Potassium may ↓"],["Generalized proximal tubular injury impairs multiple transporters","Glucose, phosphate, bicarbonate and amino acids spill into urine","Acidosis and phosphate depletion follow"]],"Acute tubular injury":[["Creatinine ↑, muddy brown granular casts or tubular epithelial cells","FeNa may be >2%, but varies with context"],["Ischemia or toxins injure tubular epithelium","Cells slough and obstruct tubules","Filtration falls and creatinine rises"]],"Acute interstitial nephritis":[["Creatinine ↑, sterile pyuria, possible WBC casts","Peripheral eosinophilia may occur and urine eosinophils are unreliable"],["A drug, infection or immune process triggers interstitial inflammation","Tubules become dysfunctional","Acute kidney injury follows"]],"Acute pyelonephritis":[["Pyuria, leukocyte esterase and sometimes nitrites","Urine culture identifies pathogen","WBC casts can occur"],["Bacteria usually ascend from bladder to kidney","Neutrophils infiltrate tubules and interstitium","Fever and flank pain develop"]],"Bartter syndrome":[["Hypokalemic metabolic alkalosis, renin and aldosterone ↑","Urine calcium often ↑, blood pressure normal or low"],["Salt transport in the thick ascending limb is impaired","Salt wasting activates renin and aldosterone","Distal sodium uptake drives potassium and acid loss"]],"Gitelman syndrome":[["Hypokalemic metabolic alkalosis, magnesium ↓, urine calcium ↓","Renin and aldosterone often ↑"],["Distal convoluted tubule NaCl cotransporter is impaired","Salt wasting increases aldosterone signaling","Potassium, hydrogen and magnesium are lost"]],"Liddle syndrome":[["Hypokalemic metabolic alkalosis with renin ↓ and aldosterone ↓","Early hypertension"],["Gain-of-function ENaC increases distal sodium reabsorption","Volume expands and renin and aldosterone are suppressed","Distal potassium and hydrogen secretion rise"]],"Hashimoto thyroiditis":[["Overt primary hypothyroidism: TSH ↑ and free T₄ ↓","Anti-TPO often positive, anti-thyroglobulin may be positive"],["Autoimmune lymphocytes damage thyroid follicles","Hormone production falls","Pituitary TSH rises as feedback weakens"]],"Graves disease":[["TSH ↓, free T₄ or T₃ ↑","TSH receptor antibodies or thyroid-stimulating immunoglobulin positive","Diffuse increased radioactive iodine uptake"],["Stimulating antibodies activate the TSH receptor","Thyroid grows and makes excess hormone","High hormone levels suppress pituitary TSH"]],"Subacute granulomatous thyroiditis":[["ESR and CRP ↑","Early TSH ↓ and free T₄ ↑","Radioactive iodine uptake low"],["Inflammation disrupts thyroid follicles","Stored hormone leaks into blood","Depleted stores can cause transient hypothyroidism before recovery"]],"Primary adrenal insufficiency":[["Cortisol ↓, ACTH ↑, inadequate response to cosyntropin","Renin ↑ and aldosterone ↓ when mineralocorticoids are deficient","Sodium ↓, potassium ↑ may occur"],["Adrenal cortex is damaged","Cortisol and often aldosterone production fall","ACTH rises and renal salt loss increases","Hypotension and hyperpigmentation may result"]],"Central adrenal insufficiency":[["Cortisol ↓ with ACTH low or inappropriately normal","Aldosterone generally preserved, potassium usually normal","Sodium may ↓"],["Pituitary ACTH or hypothalamic drive falls","Adrenal cortisol output falls","Renin–angiotensin control of aldosterone is largely preserved"]],"Primary aldosteronism":[["Renin suppressed with aldosterone inappropriately high, aldosterone-to-renin ratio ↑","Potassium may ↓ and bicarbonate may ↑"],["Adrenal aldosterone production becomes autonomous","Distal sodium retention expands volume","Renin is suppressed and potassium and hydrogen excretion rise"]],"Pheochromocytoma":[["Plasma free or urinary fractionated metanephrines ↑","Elevations require interpretation with sampling conditions and medications"],["Chromaffin tumor produces catecholamines","Adrenergic receptors are stimulated","Hypertension, sweating and palpitations follow"]],"Cushing syndrome":[["Cortisol >1.8 µg/dL after 1 mg dexamethasone suggests abnormal suppression","Late-night salivary cortisol or 24-hour urine free cortisol may ↑","ACTH helps classify cause after confirmation"],["Exogenous steroid exposure or endogenous cortisol excess increases glucocorticoid signaling","Protein catabolism and insulin resistance rise","Weakness, bruising and hyperglycemia can develop"]],"Diabetic ketoacidosis":[["Glucose ≥200 mg/dL or known diabetes","β-hydroxybutyrate ≥3 mmol/L","Venous pH <7.30 or bicarbonate <18 mmol/L","Serum potassium can be normal or high despite total-body depletion"],["Insulin deficiency and counterregulatory hormones increase lipolysis","Liver converts fatty acids to ketones","Ketones cause metabolic acidosis","Glucose and ketones drive osmotic diuresis"]],"Hyperosmolar hyperglycemic state":[["Glucose ≥600 mg/dL, effective osmolality >300 or total >320 mOsm/kg","β-hydroxybutyrate <3 mmol/L","Venous pH ≥7.30 and bicarbonate ≥15 mmol/L"],["Relative insulin deficiency permits marked hyperglycemia","Residual insulin limits ketogenesis","Osmotic diuresis depletes free water","Hyperosmolality worsens"]],"Central diabetes insipidus":[["Urine osmolality low despite high plasma osmolality","Serum sodium may ↑ if access to water is limited","Urine concentrates after desmopressin in complete central disease"],["Vasopressin release is deficient","Collecting ducts insert fewer aquaporin-2 channels","Water reabsorption falls","Dilute polyuria develops"]],"Nephrogenic diabetes insipidus":[["Urine osmolality low despite high plasma osmolality","Serum sodium may ↑ without adequate water","Little urine concentration response to desmopressin in complete disease"],["Collecting ducts resist vasopressin","Aquaporin-2 response is impaired","Water reabsorption falls","Dilute polyuria develops"]],"Primary hyperparathyroidism":[["Calcium ↑ with PTH high or inappropriately normal","Phosphate often ↓","Urinary calcium helps distinguish familial hypocalciuric hypercalcemia"],["Parathyroid adenoma or hyperplasia secretes PTH autonomously","Bone resorption and renal calcium retention increase","Renal phosphate excretion increases"]],"Familial hypocalciuric hypercalcemia":[["Calcium mildly ↑, PTH normal or mildly ↑","Calcium-to-creatinine clearance ratio <0.01 favors diagnosis, with overlap"],["Inactivating calcium-sensing pathway variant raises the calcium set point","Parathyroid glands and kidneys sense less calcium than is present","PTH is not fully suppressed and urinary calcium stays low"]],"Stable angina":[["Troponin typically normal during stable episodes","Lipids and HbA₁c assess risk rather than confirm angina"],["Fixed coronary narrowing limits flow reserve","Exertion increases oxygen demand","Transient ischemia causes pain that resolves with rest"]],"Unstable angina":[["Serial high-sensitivity troponin shows no acute myocardial injury","ECG may show transient ST depression or T-wave changes"],["Plaque disruption or other acute flow limitation reduces coronary supply","Ischemia occurs at rest or with less exertion","Myocardial necrosis is absent by biomarkers"]],"STEMI":[["Serial troponin typically rises and falls, may be initially normal","ECG shows qualifying ST elevation in contiguous leads"],["Plaque rupture or erosion commonly triggers acute thrombosis","Coronary flow abruptly falls","Severe ischemia produces ST elevation and can progress to necrosis"]],"NSTEMI":[["Troponin rises or falls with at least one value above assay-specific 99th percentile and evidence of ischemia","No persistent diagnostic ST elevation"],["Coronary blood flow is insufficient for myocardial demand","Ischemia injures and kills myocytes","Troponin leaks into blood"]],"Acute pericarditis":[["CRP and ESR often ↑","Troponin may rise with myocardial involvement","ECG may show diffuse ST elevation and PR depression"],["Inflammation affects the pericardium","Friction and movement cause positional pleuritic pain","Adjacent epicardial inflammation can alter ECG"]],"Cardiac tamponade":[["No diagnostic blood test","Echocardiography may show right-sided chamber collapse and a plethoric IVC"],["Pericardial pressure rises as fluid accumulates","Right-sided filling becomes impaired","Stroke volume falls despite elevated venous pressure"]],"Aortic stenosis":[["No diagnostic blood test","Doppler severe high-gradient pattern: peak velocity ≥4 m/s or mean gradient ≥40 mm Hg"],["Valve narrowing obstructs LV outflow","Pressure load promotes concentric LV hypertrophy","Limited cardiac output reserve causes exertional symptoms"]],"Infective endocarditis":[["Multiple blood culture sets can identify organism","CRP and ESR may ↑","Urinalysis can show microscopic hematuria"],["Microbes enter bloodstream and adhere to susceptible endocardium","Platelets and fibrin enclose organisms in vegetations","Valve damage, emboli and immune phenomena can follow"]],"Asthma":[["Variable obstruction or adult bronchodilator FEV₁ or FVC rise ≥12% and ≥200 mL","FeNO or blood eosinophils may support type 2 inflammation, normal results do not exclude asthma"],["Airway inflammation increases responsiveness to triggers","Bronchial smooth muscle contracts and mucus production rises","Airflow obstruction fluctuates"]],"COPD":[["Postbronchodilator FEV₁/FVC <0.70 in compatible context","DLCO often ↓ with emphysema","ABG may show hypoxemia or hypercapnia in advanced disease"],["Repeated inhalational injury drives airway inflammation and remodeling","Small airways narrow and alveolar walls may be destroyed","Expiratory flow becomes persistently limited"]],"Cystic fibrosis":[["Sweat chloride ≥60 mmol/L in compatible context, 30–59 intermediate","CFTR testing can confirm relevant variants","Fecal elastase may be low with pancreatic insufficiency"],["Defective CFTR alters chloride and bicarbonate transport","Airway secretions dehydrate and pancreatic ducts obstruct","Chronic infection, bronchiectasis and malabsorption can develop"]],"Sarcoidosis":[["Calcium or urine calcium may ↑","ACE can be elevated but is neither sensitive nor specific","Tissue shows noncaseating granulomas after excluding mimics"],["Dysregulated T-cell and macrophage activation forms granulomas","Granulomas affect lungs, nodes or other organs","Macrophage vitamin D activation can raise calcium"]],"Pulmonary embolism":[["D-dimer can exclude PE in selected low-probability patients when negative","Troponin or BNP may rise with RV strain","CT pulmonary angiography can show filling defect"],["A venous clot embolizes into pulmonary arteries","Perfusion drops in ventilated lung and RV afterload rises","Dyspnea, hypoxemia or circulatory compromise can follow"]],"Acute respiratory distress syndrome":[["PaO₂/FiO₂ ≤300 with PEEP or CPAP ≥5 cm H₂O in the Berlin definition","ABG shows hypoxemia","Bilateral opacities are not fully explained by cardiac failure or fluid overload"],["Inflammatory injury disrupts alveolar and capillary barriers","Protein-rich edema floods alveoli","Surfactant function falls and shunt increases","Hypoxemia follows"]],"Crohn disease":[["Fecal calprotectin and CRP may ↑","Anemia, albumin ↓ or B₁₂ deficiency can occur","Endoscopy and biopsy assess patchy inflammation and granulomas when present"],["Dysregulated immune responses to intestinal microbes sustain inflammation","Inflammation extends through bowel wall","Strictures, fistulas and malabsorption can follow"]],"Ulcerative colitis":[["Fecal calprotectin and CRP may ↑","Hemoglobin may ↓ with bleeding","Endoscopy and biopsy show continuous colitis beginning at rectum, typically mucosal"],["Immune-mediated colonic inflammation begins in rectum","Continuous mucosal injury extends proximally","Ulceration and friability produce bloody diarrhea"]],"Celiac disease":[["Tissue transglutaminase IgA and total IgA while eating gluten","IgG-based testing if IgA deficient","Duodenal biopsy may show villous atrophy and increased intraepithelial lymphocytes"],["Gluten peptides are modified by tissue transglutaminase","HLA-DQ2 or DQ8 presents peptides to T cells","Immune injury flattens villi","Malabsorption follows"]],"Acute pancreatitis":[["Lipase or amylase ≥3× upper limit is one of 3 diagnostic criteria","Diagnosis usually requires 2 of 3: typical pain, elevated enzymes, characteristic imaging","ALT may rise with biliary cause"],["Acinar injury or duct obstruction activates pancreatic enzymes prematurely","Autodigestion and inflammation injure the pancreas","Enzymes leak into blood"]],"Wilson disease":[["Ceruloplasmin often ↓","24-hour urinary copper ↑, hepatic copper may ↑","Hemolysis may be DAT negative"],["ATP7B dysfunction impairs biliary copper excretion","Copper accumulates in liver and other organs","Oxidative injury causes hepatic, neurologic and ocular findings"]],"Hereditary hemochromatosis":[["Transferrin saturation >45% prompts evaluation","Ferritin may ↑, interpret with inflammation","HFE testing helps establish cause"],["Inadequate hepcidin signaling leaves ferroportin active","Intestinal iron absorption rises","Iron accumulates in organs and produces oxidative injury"]],"Guillain–Barré syndrome":[["CSF protein ↑ with few cells, may be normal early","Nerve conduction studies support demyelinating or axonal subtype"],["Infection can trigger antibodies or immune responses against peripheral nerves","Nerve roots and nerves lose myelin or axons","Conduction slows or fails","Weakness and areflexia develop"]],"Myasthenia gravis":[["AChR antibodies or MuSK antibodies may be positive","Repetitive stimulation can show decrement","Single-fiber EMG can show increased jitter"],["Autoantibodies impair postsynaptic neuromuscular transmission","Repeated activity reduces the safety margin for transmission","Fatigable weakness develops"]],"Lambert–Eaton syndrome":[["P/Q-type voltage-gated calcium-channel antibodies may be positive","CMAP amplitude rises after brief exercise or high-frequency stimulation"],["Autoantibodies reduce presynaptic calcium entry","Less acetylcholine is released","Repeated activation accumulates calcium and transiently improves strength"]],"Multiple sclerosis":[["CSF-restricted oligoclonal IgG bands or elevated kappa free light chains may support diagnosis","MRI demonstrates characteristic CNS lesions"],["Immune cells enter the CNS and injure myelin and oligodendrocytes","Inflammatory plaques form in different regions","Conduction failure and axonal injury cause deficits"]],"Rheumatoid arthritis":[["Anti-CCP is relatively specific, rheumatoid factor may be positive","ESR and CRP may ↑","Synovial fluid is inflammatory"],["Immune responses to modified proteins activate synovial inflammation","Synovium proliferates into pannus","Inflammatory enzymes and osteoclasts erode cartilage and bone"]],"Gout":[["Synovial monosodium urate crystals are needle-shaped and strongly negatively birefringent","Serum urate can be normal during a flare"],["Urate supersaturation permits crystal deposition","Crystals activate innate immunity and IL-1β","Neutrophils enter joint and trigger acute inflammation"]],"Calcium pyrophosphate deposition disease":[["Synovial crystals are rhomboid and weakly positively birefringent","Chondrocalcinosis may be seen on imaging"],["Calcium pyrophosphate crystals accumulate in cartilage","Crystals enter joint fluid and activate innate immunity","Acute or chronic arthritis develops"]],"Systemic lupus erythematosus":[["ANA usually positive, anti-dsDNA or anti-Smith supports diagnosis","C3/C4 may ↓ with activity","CBC may show cytopenias and urine may show protein or RBCs"],["Loss of tolerance to nuclear antigens triggers autoantibodies","Immune complexes deposit in tissues and activate complement","Inflammation affects multiple organs"]],"Preeclampsia":[["New hypertension after 20 weeks with proteinuria ≥300 mg/24 h or urine protein/creatinine ≥0.3, or qualifying organ dysfunction","Platelets, creatinine and liver enzymes help assess severity"],["Abnormal placental vascular remodeling limits perfusion","Placenta releases antiangiogenic factors","Maternal endothelial dysfunction causes hypertension and organ injury"]],"Ectopic pregnancy":[["Pregnancy test positive","Serial β-hCG trends can be abnormal but do not locate pregnancy","Transvaginal ultrasound determines location when visible"],["Embryo implants outside uterine cavity, usually in a fallopian tube","Trophoblast invades local tissue","Distention or rupture causes pain and bleeding"]],"Polycystic ovary syndrome":[["Total or free testosterone may ↑","Exclude pregnancy, thyroid disease, hyperprolactinemia and nonclassic CAH as appropriate","LH:FSH ratio is not diagnostic"],["Ovarian androgen production and insulin resistance can reinforce one another","Follicle development and ovulation become irregular","Hyperandrogenism and irregular cycles develop"]],"Major depressive disorder":[["No diagnostic laboratory test","TSH, CBC or other targeted testing may be used when symptoms suggest a medical mimic"],["Genetic susceptibility, stress and other factors interact","Brain networks that regulate mood, motivation and stress function differently","Persistent mood and cognitive or physical symptoms emerge"]],"Pneumocystis pneumonia":[["In HIV CD4 often <200 cells/µL","Serum β-D-glucan may ↑ but is nonspecific","Induced sputum or BAL with organism testing supports diagnosis"],["Cell-mediated immunity is impaired","Organisms proliferate in alveoli","Foamy exudate interferes with gas exchange","Hypoxemia and diffuse infiltrates develop"]],"Chronic granulomatous disease":[["Dihydrorhodamine flow cytometry shows reduced oxidative burst","Genetic testing confirms subtype"],["NADPH oxidase is defective","Phagocytes generate fewer reactive oxygen species","Killing of certain bacteria and fungi is impaired","Recurrent infection and granulomas develop"]],"X-linked agammaglobulinemia":[["Circulating B cells markedly ↓, all major immunoglobulin classes ↓","BTK variant supports diagnosis"],["BTK deficiency blocks pre-B-cell maturation","Mature B cells and plasma cells are scarce","Antibody levels fall","Recurrent infections emerge after maternal IgG wanes"]],"Bernard–Soulier syndrome":[["Giant platelets with thrombocytopenia","Reduced ristocetin-induced agglutination that does not correct with normal plasma","Flow cytometry can show reduced GPIb-IX-V"],["Platelets lack functional GPIb-IX-V","They cannot bind VWF normally","Adhesion at injured vessels is impaired"]],"Glanzmann thrombasthenia":[["Platelet count often normal","Aggregation impaired with common agonists, ristocetin response preserved","Flow cytometry can show reduced αIIbβ3"],["Functional GPIIb/IIIa is deficient","Fibrinogen cannot bridge adjacent platelets normally","Aggregation fails"]],"Factor XIII deficiency":[["PT and aPTT usually normal","Factor XIII activity assay ↓"],["Early clot formation remains intact","Fibrin is not cross-linked adequately","Clots break down prematurely and delayed bleeding occurs"]],"Acquired factor VIII inhibitor":[["Isolated prolonged aPTT, time-dependent failure to correct on mixing","Factor VIII activity ↓","Bethesda assay can measure inhibitor titer"],["Autoantibodies neutralize factor VIII","Intrinsic tenase activity falls","Thrombin generation declines and soft-tissue bleeding can occur"]],"Acute lymphoblastic leukemia":[["Blood or marrow lymphoblasts, usually TdT-positive","Flow cytometry distinguishes B- and T-lineage","Anemia, thrombocytopenia or neutropenia may occur"],["A lymphoid precursor acquires changes that impair maturation and promote growth","Blasts expand in marrow","Normal blood-cell production falls"]],"Hairy cell leukemia":[["Pancytopenia and monocytopenia often occur","B cells express CD11c, CD25 and CD103 in classic disease","BRAF V600E common"],["A mature B-cell clone proliferates","Hairy cells accumulate in marrow and spleen","Normal hematopoiesis is suppressed"]],"Classical Hodgkin lymphoma":[["Biopsy shows Reed–Sternberg cells typically positive for CD30 and often CD15","ESR or CRP can ↑ and CBC may show anemia"],["A germinal-center B cell escapes normal cell death","Malignant cells release inflammatory signals","Reactive cells accumulate around the malignant clone"]],"Follicular lymphoma":[["Biopsy shows a follicular CD10-positive and BCL6-positive B-cell population","BCL2 overexpression and t(14","18) are common"],["t(14;18) increases antiapoptotic BCL2 expression in many cases","Germinal-center B cells survive longer","Neoplastic follicles accumulate"]],"Mantle cell lymphoma":[["Clonal B cells usually CD5 and cyclin D1 positive","FISH may show t(11","14)"],["t(11;14) places CCND1 under immunoglobulin regulatory control","Cyclin D1 promotes cell-cycle progression","Mantle-zone B cells expand"]],"Burkitt lymphoma":[["Biopsy shows high proliferation, Ki-67 often near 100%, and MYC rearrangement","LDH and uric acid may ↑"],["MYC rearrangement drives rapid B-cell proliferation","High cell turnover recruits macrophages","Starry-sky morphology and tumor lysis risk follow"]],"Waldenström macroglobulinemia":[["IgM monoclonal protein","Marrow shows lymphoplasmacytic infiltration, MYD88 L265P common","Serum viscosity may ↑"],["A lymphoplasmacytic clone secretes monoclonal IgM","IgM accumulates in plasma","High viscosity can impair microvascular flow"]],"Diamond–Blackfan anemia":[["Macrocytic anemia with very low reticulocytes","Erythroid precursors markedly reduced","Erythrocyte ADA and HbF may ↑"],["A ribosomal protein defect often disrupts erythroid development","Erythroid precursors fail to mature","Isolated red cell aplasia follows"]],"Fanconi anemia":[["Progressive cytopenias","Chromosomal breakage increases after diepoxybutane or mitomycin C exposure"],["Defective DNA interstrand cross-link repair raises genomic damage","Stem cells lose function","Marrow failure and malignancy risk increase"]],"Myelodysplastic syndrome":[["Persistent cytopenia with dysplasia on marrow evaluation","MCV often ↑, reticulocytes often ↓","Cytogenetic or molecular abnormalities may support a clonal diagnosis"],["An abnormal stem-cell clone expands","Dysplastic cells mature ineffectively","Peripheral cytopenias develop despite often cellular marrow"]],"IgA vasculitis":[["Urinalysis may show hematuria and proteinuria","Platelet count usually normal","Biopsy can show IgA-dominant small-vessel or mesangial deposits"],["IgA-containing immune complexes deposit in small vessels","Complement and neutrophils drive inflammation","Purpura, GI symptoms, arthritis or nephritis can result"]],"Calcium oxalate stones":[["Urine may contain envelope or dumbbell crystals","24-hour urine may reveal hypercalciuria, hyperoxaluria or hypocitraturia","Stone analysis confirms composition"],["Urine becomes supersaturated with calcium and oxalate","Crystals nucleate and aggregate","Stones form and can obstruct urine flow"]],"Struvite stones":[["Alkaline urine and possible coffin-lid crystals","Urine culture may grow urease-producing bacteria","Stone analysis confirms magnesium ammonium phosphate"],["Bacterial urease splits urea and generates ammonia","Urine pH rises","Magnesium ammonium phosphate precipitates"]],"Uric acid stones":[["Persistently acidic urine, often pH <5.5","Urine may show rhomboid crystals","Serum urate may be normal"],["Low urine pH protonates soluble urate","Less soluble uric acid precipitates","Radiolucent stones form"]],"Cystinuria":[["Hexagonal urine crystals","Urinary cystine increased","Stone analysis or genetic testing can confirm"],["Proximal reabsorption of cystine and dibasic amino acids is impaired","Urinary cystine rises","Poorly soluble cystine crystallizes"]],"Gilbert syndrome":[["Mild unconjugated bilirubin elevation, other liver tests generally normal","No laboratory evidence of hemolysis"],["UGT1A1 activity is mildly reduced","Bilirubin conjugation slows","Fasting or illness can reveal transient jaundice"]],"Crigler–Najjar syndrome":[["Unconjugated bilirubin markedly ↑, especially in type I","UGT1A1 variants confirm the subtype"],["UGT1A1 activity is absent or markedly reduced","Unconjugated bilirubin cannot be cleared normally","Severe elevations can cause bilirubin neurotoxicity"]],"Dubin–Johnson syndrome":[["Predominantly conjugated hyperbilirubinemia with otherwise near-normal liver tests","Urine coproporphyrin I fraction >80% is characteristic"],["ABCC2 dysfunction impairs canalicular excretion","Conjugated bilirubin returns to blood","Dark hepatic pigment accumulates"]],"Rotor syndrome":[["Predominantly conjugated hyperbilirubinemia","Total urine coproporphyrins ↑ with increased isomer I fraction"],["Loss of OATP1B1 and OATP1B3 impairs hepatic reuptake","Conjugated bilirubin remains in plasma","Benign jaundice results"]],"Primary biliary cholangitis":[["Alkaline phosphatase and GGT ↑","Antimitochondrial antibodies often positive","IgM may ↑"],["Autoimmune injury destroys small intrahepatic bile ducts","Bile flow falls","Cholestasis and fibrosis develop"]],"Primary sclerosing cholangitis":[["Cholestatic pattern with alkaline phosphatase ↑","MRCP often shows multifocal strictures and beading","IgG4 may help evaluate a mimic"],["Biliary inflammation and fibrosis narrow intrahepatic or extrahepatic ducts","Obstruction alternates with duct dilation","Cholestasis and liver injury follow"]],"α₁-antitrypsin deficiency":[["Serum α₁-antitrypsin ↓, interpret with inflammation","Phenotyping or SERPINA1 testing confirms cause","Liver enzymes may ↑"],["Misfolded protein can accumulate in hepatocytes","Circulating antiprotease activity falls","Unopposed neutrophil elastase injures alveolar walls"]],"Hypersensitivity pneumonitis":[["No diagnostic blood test","Antigen-specific serum IgG suggests exposure rather than disease","BAL lymphocytosis may support diagnosis"],["Inhaled antigen reaches distal airways in a sensitized person","Immune responses inflame alveoli and interstitium","Continued exposure can cause fibrosis"]],"Pneumothorax":[["No diagnostic blood test","Imaging may show pleural line with absent peripheral lung markings"],["Air enters pleural space","Negative pleural pressure is lost","Lung recoils and ventilation falls"]],"Tension pneumothorax":[["No diagnostic blood test","Shock and unilateral loss of breath sounds are clinical clues"],["Air enters pleural space faster than it can escape","Pleural pressure rises","Lung collapses and venous return falls","Obstructive shock develops"]],"Emphysema":[["Postbronchodilator FEV₁/FVC may be reduced with COPD","DLCO often ↓, residual ng falls"]],"Tricuspid regurgitation":[[],["Tricuspid valve fails to seal in systole","Blood returns to right atrium","Systemic venous pressure rises"]],"Atrial septal defect":[[],["Interatrial septal defect permits left-to-right flow","Right atrium and ventricle receive excess volume","Pulmonary blood flow rises"]],"Ventricular septal defect":[[],["Interventricular septal defect permits left-to-right flow","Pulmonary flow increases","Larger shunts can remodel pulmonary arteries"]],"Patent ductus arteriosus":[[],["Fetal ductus fails to close","Aortic blood flows into pulmonary artery","Pulmonary flow and left-heart volume load rise"]],"Tetralogy of Fallot":[[],["Anterior displacement of the outlet septum causes VSD and RV outflow obstruction","Aorta overrides the septum and RV hypertrophies","Severe obstruction drives right-to-left shunting"]],"D-transposition of the great arteries":[[],["Great arteries connect to the opposite ventricles","Systemic and pulmonary circulations run in parallel","Survival requires mixing through a shunt"]],"Coarctation of the aorta":[[],["Aortic isthmus narrows","Pressure rises proximal to the narrowing","Distal perfusion falls and collaterals may enlarge"]],"Eisenmenger syndrome":[[],["Chronic left-to-right shunt remodels pulmonary vessels","Pulmonary vascular resistance rises","Shunt reverses and causes cyanosis"]],"Dilated cardiomyopathy":[[],["Myocardial injury or inherited contractile dysfunction weakens systole","Ventricles dilate","Ejection fraction falls"]],"Hypertrophic cardiomyopathy":[[],["Sarcomeric variants often drive myocyte hypertrophy and disarray","Ventricular compliance falls","Diastolic filling becomes impaired"]],"Restrictive cardiomyopathy":[[],["Infiltration or fibrosis stiffens myocardium","Diastolic filling requires higher pressure","Venous congestion develops"]],"Constrictive pericarditis":[[],["Fibrotic pericardium limits cardiac expansion","Ventricles compete for fixed filling space","Systemic venous pressure struct or cavitate"]],"Small cell lung carcinoma":[[],["Neuroendocrine lung cells undergo malignant transformation","Tumor grows and disseminates rapidly","Ectopic hormone production can occur"]],"Malignant mesothelioma":[[],["Asbestos-related pleural injury increases malignant transformation risk","Mesothelial tumor spreads along pleura","Effusion and encasement restrict expansion"]],"Renal amyloidosis":[[],["Misfolded proteins aggregate as amyloid fibrils","Glomerular deposits disrupt filtration barrier","Proteinuria and renal dysfunction develop"]],"Postrenal acute kidney injury":[[],["Urinary outflow is obstructed","Pressure rises upstream","Net glomerular filtration pressure falls"]],"Clear cell renal cell carcinoma":[[],["Loss of VHL function stabilizes HIF","Angiogenic signaling increases","Highly vascular renal epithelial tumor develops"]],"Wilms tumor":[[],["Developmental alterations sustain embryonal renal precursor cells","Nephrogenic rests can persist","Malignant blastemal tumor forms"]],"Autosomal dominant polycystic kidney disease":[[],["PKD1 or PKD2 dysfunction alters tubular epithelial signaling","Fluid-filled cysts enlarge","Renal parenchyma is compressed"]],"Toxic adenoma":[[],["An activating mutation drives autonomous thyroid nodule function","T3 or T4 rises","Feedback suppresses TSH"]],"Central hypothyroidism":[[],["Pituitary or hypothalamic dysfunction reduces effective TSH stimulation","Thyroid hormone production falls"]],"Papillary thyroid carcinoma":[[],["Thyroid follicular cells acquire MAPK pathway alterations","Papillary carcinoma develops","Tumor commonly spreads through lymphatics"]],"Follicular thyroid carcinoma":[[],["Follicular cells acquire growth-promoting alterations","Tumor invades capsule or vessels","Hematogenous metastasis can follow"]],"Medullary thyroid carcinoma":[[],["Parafollicular C cells transform, sometimes through RET activation","Tumor secretes calcitonin","Malignant cells invade and spread"]],"Anaplastic thyroid carcinoma":[[],["Thyroid cancer cells dedifferentiate","Rapid growth and local invasion develop","Neck structures can be compressed"]],"Humoral hypercalcemia of malignancy":[[],["Tumor secretes PTH-related peptide","Bone resorption and renal calcium retention rise","Calcium rises and endogenous PTH falls"]],"Prolactinoma":[[],["Lactotroph adenoma secretes prolactin","GnRH pulsatility falls","Hypogonadism and possible galactorrhea follow"]],"Acromegaly":[[],["Excess growth hormone usually comes from a pituitary adenoma","IGF-1 rises","Soft tissue and acral bones enlarge"]],"Sheehan syndrome":[[],["Severe obstetric blood loss reduces pituitary perfusion","Enlarged anterior pituitary undergoes ischemic injury","Pituitary hormones fall"]],"21-hydroxylase deficiency":[[],["Impaired 21-hydroxylase lowers cortisol and sometimes aldosterone","ACTH rises","Steroid precursors are diverted toward androgens"]],"11β-hydroxylase deficiency":[[],["Impaired 11β-hydroxylase lowers cortisol","ACTH raises precursor production","Deoxycorticosterone and androgens accumulate"]],"17α-hydroxylase deficiency":[[],["Impaired 17α-hydroxylase lowers sex steroids and cortisol","Steroid synthesis shifts toward mineralocorticoid precursors","Hypertension and hypokalemia can develop"]],"Achalasia":[[],["Inhibitory myenteric neurons degenerate","Lower esophageal sphincter fails to relax and peristalsis is lost","Esophageal contents accumulate"]],"Eosinophilic esophagitis":[[],["Antigen-driven type 2 inflammation recruits eosinophils","Chronic epithelial injury and remodeling develop","Esophageal narrowing causes dysphagia"]],"Barrett esophagus":[[],["Chronic reflux injures distal squamous mucosa","Intestinal-type columnar metaplasia develops","Dysplasia may progress to adenocarcinoma"]],"Hypertrophic pyloric stenosis":[[],["Pyloric smooth muscle hypertrophies","Gastric outlet narrows","Repeated vomiting depletes hydrogen and chloride"]],"Helicobacter pylori gastritis":[[],["Urease helps H. pylori survive in gastric mucus","Chronic mucosal inflammation damages epithelium","Ulceration or atrophy can develop"]],"Zollinger–Ellison syndrome":[[],["Gastrinoma secretes gastrin autonomously","Gastric acid output rises","Peptic ulcers and acid-related diarrhea develop"]],"Microscopic colitis":[[],["Colonic mucosal inflammation alters water handling","Watery diarrhea develops","Biopsy shows lymphocytic inflammation or a thickened collagen band"]],"Whipple disease":[[],["Tropheryma whipplei accumulates in intestinal macrophages","Small-bowel mucosa becomes infiltrated","Malabsorption and systemic manifestations follow"]],"Meckel diverticulum":[[],["Vitelline duct fails to involute","True ileal diverticulum persists","Ectopic gastric mucosa may cause adjacent ulceration and bleeding"]],"Chronic pancreatitis":[[],["Repeated pancreatic injury promotes fibrosis","Acinar and ductal tissue are lost","Exocrine insufficiency and later diabetes can develop"]],"Biliary colic":[[],["A stone transiently obstructs cystic duct","Gallbladder contracts against obstruction","Distension produces episodic pain"]],"Acute cholecystitis":[[],["Persistent cystic duct obstruction distends gallbladder","Wall ischemia and inflammation follow","Secondary infection can occur"]],"Acute cholangitis":[[],["Biliary obstruction impairs drainage","Ascending bacteria multiply in stagnant bile","Infection may spread systemically"]],"Acute appendicitis":[[],["Appendiceal obstruction can trap secretions","Pressure, bacterial growth, and inflammation rise","Ischemia or perforation can follow"]],"Acute mesenteric ischemia":[[],["Arterial occlusion, venous thrombosis, or low flow limits intestinal perfusion","Mucosal injury progresses","Transmural infarction can develop"]],"Hepatocellular carcinoma":[[],["Chronic liver injury or direct oncogenic insults alter hepatocytes","Malignant clones expand","Tumor can invade portal or hepatic vessels"]],"Pancreatic ductal adenocarcinoma":[[],["Pancreatic ductal cells accumulate oncogenic alterations","Invasive glands recruit dense stroma","Head lesions may obstruct the common bile duct"]],"Tension-type headache":[[],["Pericranial nociceptive input and pain sensitization contribute","Sustained bilateral pressure-like pain develops"]],"Migraine":[[],["Trigeminovascular pathways activate and release CGRP","Meningeal nociception and sensitization produce headache","Cortical spreading depolarization can produce aura"]],"Cluster headache":[[],["Hypothalamic timing circuits are implicated","Trigeminal pain activates cranial parasympathetic outflow","Unilateral attacks produce ipsilateral autonomic signs"]],"Trigeminal neuralgia":[[],["Vascular compression commonly injures trigeminal root myelin","Touch can trigger ectopic firing","Brief electric-shock pain follows"]],"Subarachnoid hemorrhage":[[],["An aneurysm or other vessel ruptures","Blood enters subarachnoid space","Meningeal irritation and intracranial pressure rise"]],"Epidural hematoma":[[],["Trauma tears a meningeal vessel, often middle meningeal artery","Blood separates dura from skull","Expanding hematoma can cause herniation"]],"Subdural hematoma":[[],["Shearing tears bridging veins","Blood accumulates between dura and arachnoid","Mass effect can evolve over hours to weeks"]],"Amyotrophic lateral sclerosis":[[],["Upper and lower motor neurons progressively degenerate","Denervation and loss of descending inhibition develop","Weakness, atrophy, and spasticity accumulate"]],"Neuromyelitis optica spectrum disorder":[[],["AQP4-IgG commonly targets astrocytes","Complement-mediated injury causes secondary demyelination","Optic nerves and spinal cord are frequent targets"]],"Parkinson disease":[[],["Nigrostriatal dopaminergic neurons degenerate","Striatal dopamine falls","Basal ganglia circuits suppress movement initiation"]],"Huntington disease":[[],["HTT CAG expansion produces toxic mutant huntingtin","Striatal neurons degenerate","Chorea and later cognitive and motor decline develop"]],"Alzheimer disease":[[],["Amyloid-β and abnormal tau accumulate","Synaptic failure and neuronal loss progress","Memory networks are affected early"]],"Dementia with Lewy bodies":[[],["α-Synuclein aggregates in cortical and subcortical neurons","Cognitive and motor circuits degenerate","Fluctuations and parkinsonism develop"]],"Frontotemporal dementia":[[],["Tau, TDP-43, or other protein pathology injures frontal and temporal networks","Neuronal loss progresses","Behavior or language changes emerge"]],"Normal pressure hydrocephalus":[[],["Altered CSF dynamics enlarge ventricles","Periventricular networks are disrupted","Gait, bladder control, and cognition can deteriorate"]],"Glioblastoma":[[],["Astrocytic-lineage tumor cells proliferate and infiltrate brain","Hypoxia drives necrosis and microvascular proliferation","Edema and mass effect develop"]],"Meningioma":[[],["Arachnoid cap cells proliferate","Dural-based mass grows","Adjacent brain or cranial nerves are compressed"]],"Vestibular schwannoma":[[],["Schwann cells proliferate along vestibular nerve, often after NF2 loss","Tumor enlarges in internal auditory canal","Hearing and balance pathways are affected"]],"Medulloblastoma":[[],["Cerebellar precursor cells acquire developmental pathway alterations","Malignant embryonal tumor expands","CSF obstruction or dissemination can follow"]],"Acute angle-closure glaucoma":[[],["Peripheral iris blocks trabecular outflow, commonly after pupillary block","Intraocular pressure rises abruptly","Optic nerve and anterior segment are injured"]],"Central retinal artery occlusion":[[],["Embolus or thrombus occludes central retinal artery","Inner retina becomes ischemic","Sudden monocular vision loss develops"]],"Central retinal vein occlusion":[[],["Venous outflow is obstructed","Retinal venous pressure rises","Hemorrhage and macular edema impair vision"]],"Retinal detachment":[[],["Retinal tear, traction, or exudate separates neurosensory retina from pigment epithelium","Photoreceptor support falls","Visual field loss progresses"]],"Osteoarthritis":[[],["Mechanical stress and abnormal joint repair degrade cartilage","Subchondral bone remodels and osteophytes form","Pain and stiffness develop"]],"Septic arthritis":[[],["Microbes enter joint, commonly via blood","Neutrophilic inflammation fills synovial space","Cartilage can be rapidly damaged"]],"Ankylosing spondylitis":[[],["Immune-mediated enthesitis and sacroiliitis develop in genetically susceptible patients","Inflammation induces new bone formation","Axial joints may fuse"]],"Psoriatic arthritis":[[],["Psoriasis-associated immune signaling inflames synovium and entheses","Erosion and new bone formation can coexist","Dactylitis or axial disease develops"]],"Reactive arthritis":[[],["GI or GU infection triggers an immune response","Sterile inflammation develops in joints and entheses","Asymmetric arthritis can follow"]],"Osteoporosis":[[],["Bone resorption outpaces formation or peak bone mass is low","Bone mass and microarchitecture deteriorate","Fragility fractures become more likely"]],"Osteomalacia":[[],["Insufficient mineral availability or phosphate wasting impairs mineralization","Unmineralized osteoid accumulates","Adult bone softens"]],"Rickets":[[],["Deficient mineralization affects growing bone and growth plates","Growth plates widen and deform","Bowing or delayed growth develops"]],"Paget disease of bone":[[],["Focal osteoclast activity increases","Compensatory bone formation accelerates","Disorganized mosaic bone enlarges and weakens"]],"Osteosarcoma":[[],["Malignant osteoblast-lineage cells proliferate","Tumor cells produce osteoid","Aggressive bone destruction and spread can follow"]],"Ewing sarcoma":[[],["EWSR1 fusion alters transcription","Primitive tumor cells proliferate","Aggressive bone or soft-tissue lesions develop"]],"Giant cell tumor of bone":[[],["Neoplastic stromal cells express RANKL","Osteoclast-like giant cells are recruited","Local bone is resorbed"]],"Oste culature and skin","Perifascicular muscle fibers atrophy","Proximal weakness and characteristic rash develop"]],"Duchenne muscular dystrophy":[[],["DMD variants commonly disrupt the reading frame","Dystrophin is nearly absent","Contraction injures muscle fibers and progressive weakness follows"]],"Becker muscular dystrophy":[[],["DMD variants commonly preserve the reading frame","Partly functional dystrophin remains","Muscle degeneration progresses more slowly"]],"Osteogenesis imperfecta":[[],["Usually COL1A1 or COL1A2 variants impair type I collagen","Bone matrix loses tensile strength","Low-trauma fractures occur"]],"Ehlers–Danlos syndrome":[[],["Inherited connective tissue defects alter collagen structure or processing in many subtypes","Skin, joints, or vessel walls lose mechanical integrity","Manifestations vary by subtype"]],"Marfan syndrome":[[],["FBN1 variants disrupt fibrillin microfibrils and signaling","Elastic tissue and aortic media weaken","Aortic dilation and lens displacement can develop"]],"Complete hydatidiform mole":[[],["An ovum lacking a functional maternal genome acquires paternal chromosomes","Trophoblast proliferates diffusely","Hydropic villi form without fetal tissue"]],"Placenta previa":[[],["Placenta implants over or near the internal cervical os","Cervical change shears placental attachment","Typically painless bleeding occurs"]],"Placental abruption":[[],["Decidual bleeding separates a normally implanted placenta","Retroplacental blood and uterine irritability develop","Maternal bleeding and fetal compromise can follow"]],"Uterine atony":[[],["Uterus contracts inadequately after delivery","Placental bed vessels remain open","Postpartum hemorrhage develops"]],"Eclampsia":[[],["Placental dysfunction promotes endothelial injury in preeclampsia","Cerebral autoregulation and vascular integrity can fail","Seizures define eclampsia"]],"Endometriosis":[[],["Endometrial-like tissue establishes outside uterus","Cyclic bleeding and local inflammat detailsDialog.innerHTML = '<form method="dialog" class="dialog-head"><h2 id="disease-details-title"></h2><button>Close</button></form><h3 class="lab-heading">Lab findings and tests</h3><ul></ul><h3>How it develops</h3><ol></ol>';

function fillDetailsList(selector, items) {
  const list = detailsDialog.querySelector(selector);
  list.replaceChildren(...items.map(item => {
    const row = document.createElement('li');
    row.textContent = item;
    return row;
  }));
}

function showDiseaseDetails(name) {
  const [labs, mechanism] = diseaseDetails[name];
  detailsDialog.querySelector('h2').textContent = name;
  detailsDialog.querySelector('.lab-heading').hidden = labs.length === 0;
  detailsDialog.querySelector('ul').hidden = labs.length === 0;
  fillDetailsList('ul', labs);
  fillDetailsList('ol', mechanism);
  detailsDialog.showModal();
  detailsDialog.scrollTop = 0;
}

const drugDialog = document.createElement('dialog');
drugDialog.className = 'atlas-dialog disease-details';
drugDialog.setAttribute('aria-labelledby', 'drug-details-title');
drugDialog.innerHTML = '<form method="dialog" class="dialog-head"><h2 id="drug-details-title"></h2><button>Close</button></form>';
main.append(drugDialog);

function showDrugDetails(drug) {
  drugDialog.querySelector('h2').textContent = drug.text;
  drugDialog.querySelectorAll('section').forEach(section => section.remove());
  const labels = ['Mechanism of action', 'Adverse drug reactions', 'Contraindications and avoidance'];
  for (const [i, note] of drug.notes.entries()) {
    if (!note) continue;
    const section = document.createElement('section');
    const heading = document.createElement('h3');
    const list = document.createElement('ul');
    heading.textContent = labels[i];
    for (const sentence of note.split(/(?<=\.)\s+(?=[A-Z])/u)) {
      const item = document.createElement('li');
      item.textContent = sentence;
      list.append(item);
    }
    section.append(heading, list);
    drugDialog.append(section);
  }
  drugDialog.showModal();
  drugDialog.scrollTop = 0;
}

 row.append(box);
 if(data.children?.length){

     group.append(svg, ...data.children.map(child => renderNode(child, depth + 1)));
   }
   group.hidden=!open;button.textContent=open?'‹':'›';button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',(open?'Collapse ':'Expand ')+data.text);
   moveTo(x, y + top - box.getBoundingClientRect().top);
   updateConnectors();
  };
 }
 return row;
}
function reset() {
  const topic = select.value === 'all' ? all : select.value === 'search' ? searchRoot : topics.find(item => item.id === select.value).node;
  tree.replaceChildren(renderNode(topic));
  centerView();
}
select.onchange = reset;
controls.querySelector('#reset-map').onclick = reset;
controls.querySelector('#center-map').onclick = centerView;
controls.querySelector('#print-map').onclick = () => window.print();

const fullscreenButton = controls.querySelector('#fullscreen-map');
let expandedInBrowser = false;

function syncFullscreen() {
  const expanded = expandedInBrowser || document.fullscreenElement === main;
  main.classList.toggle('map-fullscreen', expanded);
  document.documentElement.classList.toggle('map-fullscreen', expanded);
  fullscreenButton.textContent = expanded ? 'Exit full screen' : 'Full screen';
}

fullscreenButton.addEventListener('click', async () => {
  if (document.fullscreenElement === main) {
    await document.exitFullscreen();
    return;
  }
  if (expandedInBrowser) {
    expandedInBrowser = false;
    syncFullscreen();
    return;
  }
  if (document.fullscreenEnabled && main.requestFullscreen) {
    try {
      await main.requestFullscreen();
      return;
    } catch {
      // A browser or embedded preview can block native fullscreen.
    }
  }
  expandedInBrowser = true;
  syncFullscreen();
});
document.addEventListener('fullscreenchange', syncFullscreen);
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape' || !expandedInBrowser) return;
  expandedInBrowser = false;
  syncFullscreen();
  fullscreenButton.focus({preventScroll: true});
});

document.body.classList.add('map-ready');
reset();
</script>
</body>
